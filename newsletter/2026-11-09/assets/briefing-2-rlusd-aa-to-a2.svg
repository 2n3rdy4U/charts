<text y="64.2"><tspan x="102.0" font-size="15" font-weight="600" fill="#0034a5" letter-spacing="2.40">CONSUMER CREDIT MATTERS</tspan></text>
<text y="147.0"><tspan x="56.0" font-size="34" font-weight="700" fill="#1a1f2b" letter-spacing="-0.34">RLUSD's reserve scored Aa. The structure around it brought the</tspan></text>
<text y="187.1"><tspan x="56.0" font-size="34" font-weight="700" fill="#1a1f2b" letter-spacing="-0.34">rating to A2.</tspan></text>
<text y="221.5"><tspan x="56.0" font-size="18" font-weight="400" fill="#555c68">Moody's new issue report: the collateral is strong. The deductions concern who gets it, and how fast, if the issuer fails.</tspan></text>
<text y="279.4"><tspan x="164.8" font-size="17" font-weight="700" fill="#0034a5" letter-spacing="0.17">Reserve analysis: Aa</tspan></text>
<text y="279.4"><tspan x="600.0" font-size="17" font-weight="700" fill="#0034a5" letter-spacing="0.17">Assigned: A2 / P-1</tspan></text>
<text y="299.0"><tspan x="164.8" font-size="14" font-weight="400" fill="#0034a5">Credit quality and stressed market value of T-bills and</tspan></text>
<text y="299.0"><tspan x="600.0" font-size="14" font-weight="400" fill="#0034a5">After legal and operational</tspan></text>
<text y="317.9"><tspan x="164.8" font-size="14" font-weight="400" fill="#0034a5">cash</tspan></text>
<text y="317.9"><tspan x="600.0" font-size="14" font-weight="400" fill="#0034a5">adjustments</tspan></text>
<text y="361.3"><tspan x="91.2" font-size="18" font-weight="600" fill="#6b717c">Aaa</tspan></text>
<text y="361.3"><tspan x="200.8" font-size="18" font-weight="600" fill="#0034a5">Aa1</tspan></text>
<text y="361.3"><tspan x="310.2" font-size="18" font-weight="600" fill="#0034a5">Aa2</tspan></text>
<text y="361.3"><tspan x="419.5" font-size="18" font-weight="600" fill="#0034a5">Aa3</tspan></text>
<text y="361.3"><tspan x="534.1" font-size="18" font-weight="600" fill="#6b717c">A1</tspan></text>
<text y="361.3"><tspan x="752.9" font-size="18" font-weight="600" fill="#6b717c">A3</tspan></text>
<text y="361.3"><tspan x="851.8" font-size="18" font-weight="600" fill="#6b717c">Baa1</tspan></text>
<text y="361.3"><tspan x="961.2" font-size="18" font-weight="600" fill="#6b717c">Baa2</tspan></text>
<text y="361.3"><tspan x="1070.6" font-size="18" font-weight="600" fill="#6b717c">Baa3</tspan></text>
<text y="362.8"><tspan x="641.0" font-size="22" font-weight="600" fill="#ffffff">A2</tspan></text>
<text y="448.6"><tspan x="349.0" font-size="13.5" font-weight="600" fill="#0034a5">Notched down for legal and operational risk</tspan></text>
<text y="484.6"><tspan x="530.0" font-size="12.5" font-weight="400" fill="#6b717c" letter-spacing="1.00">INVESTMENT GRADE</tspan></text>
<text y="540.4"><tspan x="56.0" font-size="13" font-weight="700" fill="#0034a5" letter-spacing="1.56">WHAT BROUGHT IT DOWN, AND MOODY'S MITIGANTS</tspan></text>
<text y="594.8"><tspan x="75.0" font-size="18" font-weight="700" fill="#1a1f2b">No priority claim</tspan></text>
<text y="594.8"><tspan x="442.3" font-size="18" font-weight="700" fill="#1a1f2b">Issuer not bankruptcy-remote</tspan></text>
<text y="594.8"><tspan x="809.7" font-size="18" font-weight="700" fill="#1a1f2b">No tested successor</tspan></text>
<text y="623.4"><tspan x="75.0" font-size="14.5" font-weight="400" fill="#2b3240">Holders don't own the reserve or hold a security</tspan></text>
<text y="623.4"><tspan x="442.3" font-size="14.5" font-weight="400" fill="#2b3240">SCTC may legally do other business, though in</tspan></text>
<text y="623.4"><tspan x="809.7" font-size="14.5" font-weight="400" fill="#2b3240">No parallel backup operator or tested hand-off if</tspan></text>
<text y="644.4"><tspan x="75.0" font-size="14.5" font-weight="400" fill="#2b3240">interest in it, so other creditors could compete</tspan></text>
<text y="644.4"><tspan x="442.3" font-size="14.5" font-weight="400" fill="#2b3240">practice it only issues RLUSD.</tspan></text>
<text y="644.4"><tspan x="809.7" font-size="14.5" font-weight="400" fill="#2b3240">Ripple or a key provider fails.</tspan></text>
<text y="665.4"><tspan x="75.0" font-size="14.5" font-weight="400" fill="#2b3240">for it in an issuer bankruptcy.</tspan></text>
<text y="685.6"><tspan x="442.3" font-size="13.5" font-weight="600" fill="#1a1f2b">Mitigant:</tspan></text>
<text y="685.6"><tspan x="502.3" font-size="13.5" font-weight="400" fill="#555c68">NYDFS can take over SCTC as receiver,</tspan></text>
<text y="685.6"><tspan x="809.7" font-size="13.5" font-weight="600" fill="#1a1f2b">Mitigants:</tspan></text>
<text y="685.6"><tspan x="876.7" font-size="13.5" font-weight="400" fill="#555c68">wind-down plan, disaster-recovery</tspan></text>
<text y="701.6"><tspan x="442.3" font-size="13.5" font-weight="400" fill="#555c68">which could support an orderly wind-down.</tspan></text>
<text y="701.6"><tspan x="809.7" font-size="13.5" font-weight="400" fill="#555c68">testing, NYDFS supervision.</tspan></text>
<text y="706.7"><tspan x="75.0" font-size="13.5" font-weight="600" fill="#1a1f2b">Mitigants:</tspan></text>
<text y="706.7"><tspan x="142.0" font-size="13.5" font-weight="400" fill="#555c68">accounts titled for holders; NYDFS</tspan></text>
<text y="722.7"><tspan x="75.0" font-size="13.5" font-weight="400" fill="#555c68">requires the reserve be used for redemptions.</tspan></text>
<text y="738.7"><tspan x="75.0" font-size="13.5" font-weight="400" fill="#555c68">Moody's expects the GENIUS Act (Jan. 18, 2027) to</tspan></text>
<text y="754.7"><tspan x="75.0" font-size="13.5" font-weight="400" fill="#555c68">add stronger protection.</tspan></text>
<text y="830.1"><tspan x="56.0" font-size="12.5" font-weight="600" fill="#3d434e">Note:</tspan></text>
<text y="830.1"><tspan x="91.0" font-size="12.5" font-weight="400" fill="#6b717c">Moody's reports the reserve outcome as “Aa” without specifying Aa1, Aa2 or Aa3; the dashed cells show that range, not a notch count. P-1 is the short-term rating. SCTC = Standard</tspan></text>
<text y="849.5"><tspan x="56.0" font-size="12.5" font-weight="400" fill="#6b717c">Custody &amp; Trust Company, Ripple's NYDFS-regulated issuer.</tspan></text>
<text y="869.0"><tspan x="56.0" font-size="12.5" font-weight="600" fill="#3d434e">Source:</tspan></text>
<text y="869.0"><tspan x="105.0" font-size="12.5" font-weight="400" fill="#6b717c">Moody's Ratings, Ripple (RLUSD) Stablecoin: New Issue Report, Nov. 5, 2026.</tspan><tspan x="586.0" font-size="12.5" font-weight="400" fill="#6b717c">Black Analytics</tspan></text>
<text y="869.0"><tspan x="546.8" font-size="12.5" font-weight="600" fill="#3d434e">Chart:</tspan></text>
