<title id="t">RLUSD's reserve scored Aa. The structure around it brought the rating to A2.</title>
<desc id="d">A ten-step rating scale from Aaa to Baa3. The reserve analysis sits in the Aa range (Aa1 to Aa3, dashed); the assigned rating A2/P-1 is marked, with an arrow labelled notched down for legal and operational risk. Three cards below name the deductions (no priority claim, issuer not bankruptcy-remote, no tested successor) and Moody's mitigants.</desc>
