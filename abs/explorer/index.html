<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto ABS Data Explorer</title>
  <style>
    :root {
      --text:#111827; --muted:#6b7280; --border:#e5e7eb;
      --bg:#ffffff; --accent:#1e40af; --btn-bg:#f3f4f6;
    }
    *, *::before, *::after { box-sizing:border-box; }
    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--text); height:100%;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    }
    body { display:flex; flex-direction:column; overflow:hidden; }
    .wrap {
      flex:1; display:flex; flex-direction:column; max-width:1200px; width:100%;
      margin:0 auto; padding:10px 14px 32px; overflow:auto;
    }
    /* ── header ── */
    .hdr {
      display:flex; align-items:center; gap:12px; padding-bottom:8px;
      border-bottom:1px solid var(--border); flex-wrap:wrap;
    }
    .brand { flex:1; }
    .brand-title { font-size:15px; font-weight:600; }
    .brand-sub { font-size:11px; color:var(--muted); margin-top:1px; }
    .meta-date { font-size:11.5px; color:var(--muted); white-space:nowrap; }
    /* ── filter bars ── */
    .fbar {
      display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 14px;
      padding:7px 0; border-bottom:1px solid var(--border);
    }
    .ctrl { display:flex; flex-direction:column; gap:3px; }
    label.lbl { font-size:11px; color:var(--muted); font-weight:500; white-space:nowrap; }
    .meta-note { font-size:10.5px; color:var(--muted); font-weight:400; }
    select {
      font-size:12.5px; padding:4px 7px;
      border:1px solid var(--border); border-radius:6px; background:#fff;
    }
    /* ── button groups ── */
    .btn-group { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .btn-group button {
      border:none; background:var(--btn-bg); font-size:12px; padding:4px 9px;
      cursor:pointer; color:var(--text); transition:background 0.12s;
    }
    .btn-group button.active  { background:#dbeafe; color:#1e40af; border-color:#1e40af; }
    .btn-group button:hover:not(.active) { background:#e5e7eb; }
    /* ── custom multi-select dropdown ── */
    .multi-sel { position:relative; display:inline-block; }
    .multi-sel-btn {
      font-size:12.5px; padding:4px 10px; border:1px solid var(--border);
      border-radius:6px; background:#fff; cursor:pointer; color:var(--text);
      white-space:nowrap; max-width:320px; overflow:hidden; text-overflow:ellipsis;
      text-align:left; min-width:160px;
    }
    .multi-sel-btn:hover { background:var(--btn-bg); }
    .multi-sel-panel {
      position:absolute; top:calc(100% + 4px); left:0; z-index:200;
      background:#fff; border:1px solid var(--border); border-radius:8px;
      box-shadow:0 4px 14px rgba(0,0,0,.12); padding:5px 0;
      min-width:200px; max-height:280px; overflow-y:auto;
    }
    .multi-sel-panel label {
      display:flex; align-items:center; gap:7px; padding:4px 12px;
      font-size:12.5px; cursor:pointer; user-select:none; color:var(--text);
    }
    .multi-sel-panel label:hover { background:var(--btn-bg); }
    .multi-sel-panel input[type=checkbox] { cursor:pointer; accent-color:var(--accent); }
    .multi-sel-sep { height:1px; background:var(--border); margin:4px 8px; }
    /* ── chart ── */
    #vis { flex:1; width:100%; min-height:0; overflow:visible; margin-bottom:4px; }
    .vega-embed { width:100% !important; height:100% !important; }
    .vega-embed > div { height:100% !important; }
    /* suppress Vega-Lite's selection-highlight background rect on legend entries */
    .vega-embed svg .role-legend-entry rect.background { fill:none !important; }
    .loading { padding:20px; font-size:13px; color:var(--muted); }
    .err { color:#dc2626; }
    /* ── heatmap toggle switch ── */
    .hm-switch { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
    .hm-switch input { display:none; }
    .hm-track {
      width:32px; height:18px; border-radius:9px; background:var(--border);
      position:relative; transition:background .2s; flex-shrink:0;
    }
    .hm-track::after {
      content:''; position:absolute; top:2px; left:2px;
      width:14px; height:14px; border-radius:50%;
      background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
      transition:transform .2s;
    }
    .hm-switch input:checked + .hm-track { background:var(--accent); }
    .hm-switch input:checked + .hm-track::after { transform:translateX(14px); }
    /* ── annual table ── */
    #tblWrap { flex:0 0 auto; width:100%; overflow:auto; display:none; padding:8px 4px 24px; box-sizing:border-box; }
    #tblWrap table { border-collapse:collapse; font-size:12px; white-space:nowrap; width:100%; }
    #tblWrap th {
      position:sticky; top:0; background:#f3f4f6; border:1px solid var(--border);
      padding:5px 10px; font-weight:600; color:var(--muted); z-index:1;
    }
    #tblWrap th.row-hdr { position:sticky; left:0; z-index:2; background:#f3f4f6; }
    #tblWrap td { border:1px solid var(--border); padding:4px 10px; text-align:right; min-width:60px; }
    #tblWrap td.row-hdr {
      position:sticky; left:0; background:#fff; font-weight:500;
      text-align:left; border-right:2px solid var(--border); z-index:1;
    }
    #tblWrap tr:hover td { filter:brightness(0.95); }
    /* ── filter bar separator ── */
    .bar-sep { width:1px; background:var(--border); align-self:stretch; margin:2px 8px; flex-shrink:0; }
    /* ── info button + popover ── */
    .info-btn { background:var(--border); border:none; cursor:pointer; font-size:13px;
                font-weight:600; color:var(--muted); border-radius:50%;
                width:26px; height:26px; display:inline-flex; align-items:center;
                justify-content:center; line-height:1; flex-shrink:0; transition:background .15s,color .15s; }
    .info-btn:hover { background:#d0d5dd; color:var(--text); }
    .info-popover { position:absolute; z-index:200; background:#fff; border:1px solid var(--border);
                    border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,.12);
                    padding:12px 14px; width:340px; font-size:12px; line-height:1.55;
                    color:var(--text); }
    .info-popover h4 { margin:0 0 7px; font-size:12px; font-weight:600; color:var(--text); }
    .info-popover ul { margin:0; padding-left:16px; }
    .info-popover li { margin-bottom:5px; }
    .info-popover li:last-child { margin-bottom:0; }
    .info-popover b { font-weight:600; }
    /* ── table title ── */
    .tbl-title { font-size:13px; font-weight:600; color:var(--text); padding:6px 4px 2px; }
    .tbl-subtitle { font-size:11px; color:var(--muted); padding:0 4px 6px; }
    /* ── source attribution footer ── */
    #source-bar {
      flex-shrink:0; padding:8px 0 6px;
      margin-top:6px; border-top:1px solid var(--border);
      font-size:11px; color:var(--muted);
      line-height:1.4;
    }
    /* ── toast notification ── */
    #toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
      background:#1f2937; color:#fff; font-size:12.5px; padding:9px 16px;
      border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.25);
      opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
      z-index:9999; max-width:320px; text-align:center; line-height:1.4;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    /* ── mode visibility ── */
    .vintage-only, .ts-only { display:none; }
    body[data-mode="vintage"]    .vintage-only { display:flex; }
    body[data-mode="timeseries"] .ts-only      { display:flex; }
    /* ── export region fills remaining height ── */
    #export-region { flex:1; display:flex; flex-direction:column; min-height:0; }
    /* ── mode tab strip ── */
    .mode-tabs { display:flex; border-bottom:2px solid var(--border); flex-shrink:0; margin:0 -14px; padding:0 14px; }
    .mode-tab {
      border:none; background:none; padding:8px 16px 7px; font-size:13px; font-weight:500;
      cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-2px;
      transition:color .15s,border-color .15s; white-space:nowrap;
    }
    .mode-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .mode-tab:hover:not(.active) { color:var(--text); background:#f9fafb; }
    @media (max-width:640px) {
      html, body { height:auto; overflow:auto; }
      body { overflow-y:auto; }
      .wrap { overflow:visible; padding:8px; height:auto; min-height:0; }
      .bar-sep { display:none; }
      #vis { min-height:320px; height:380px; max-height:440px; }
      #tblWrap { max-height:420px; }
    }
    @media print {
      html, body { height:auto; overflow:visible; }
      body { display:block; }
      .wrap { overflow:visible; max-width:100%; padding:12px 18px 24px; }
      .hdr, .mode-tabs { display:flex !important; }
      .fbar, .btn-group, #export-btn, #toast { display:none !important; }
      #export-region { display:block; }
      #vis { overflow:visible; height:auto; min-height:400px; page-break-inside:avoid; margin-bottom:0; }
      #tblWrap { overflow:visible; height:auto; display:block !important; page-break-inside:avoid; padding-bottom:24px; }
      #source-bar { font-size:11px; padding:2px 0 8px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1/dist/html-to-image.min.js"></script>

</head>

  const issuerLabel = Object.fromEntries(ISSUERS.map(x => [x.code, `${x.label || x.code} (${x.code})`]));

  // ── Issuer dropdown (vintage) ────────────────────────────────────────
  const issuerSel = document.getElementById('issuerSel');
  for (const it of ISSUERS) {
    const o = document.createElement('option');
    o.value = it.code; o.textContent = issuerLabel[it.code];
    issuerSel.appendChild(o);
  }
  const defCode = ISSUERS.some(x => x.code === DEFAULT_ISSUER)
    ? DEFAULT_ISSUER : (ISSUERS[0] ? ISSUERS[0].code : '');
  issuerSel.value = defCode;

  // ── Issuer multi-select panel (time series) ──────────────────────────
  const issuerBtn   = document.getElementById('issuerBtn');
  const issuerPanel = document.getElementById('issuerPanel');
  let selectAllCb   = null;
  const issuerCbs   = [];

  function syncSelectAll() {
    if (!selectAllCb) return;
    if (selectedIssuers.size === 0) {
      selectAllCb.checked = false; selectAllCb.indeterminate = false;
    } else if (selectedIssuers.size === ISSUERS.length) {
      selectAllCb.checked = true; selectAllCb.indeterminate = false;
    } else {
      selectAllCb.checked = false; selectAllCb.indeterminate = true;
    }
  }

  // "Show All Issuers" row
  (function() {
    const lbl = document.createElement('label');
    lbl.id = 'showAllRow';
    selectAllCb = document.createElement('input');
    selectAllCb.type = 'checkbox';
    selectAllCb.addEventListener('change', () => {
      selectAllCb.indeterminate = false;
      for (const cb of issuerCbs) {
        cb.checked = selectAllCb.checked;
        if (selectAllCb.checked) selectedIssuers.add(cb.value);
        else selectedIssuers.delete(cb.value);
      }
      updateIssuerBtn(); render();
    });
    lbl.appendChild(selectAllCb);
    lbl.appendChild(document.createTextNode(' Show All Issuers'));
    issuerPanel.appendChild(lbl);
    const sep = document.createElement('div'); sep.className = 'multi-sel-sep';
    issuerPanel.appendChild(sep);
  })();

  // "All avg" row with separator
  (function() {
    const lbl = document.createElement('label');
    const cb  = document.createElement('input');
    cb.type = 'checkbox'; cb.value = '__all__';
    cb.addEventListener('change', () => {
      if (cb.checked && displayMode === 'seasonal' && selectedIssuers.size > 0) {
        cb.checked = false;
        showToast('Year Overlay supports one issuer or All avg — not both. Deselect the current issuer first.');
        return;
      }
      showAllAvg = cb.checked; updateIssuerBtn(); render();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(' All Issuers'));
    lbl.title = 'Loan-count–weighted aggregate: delinquent loans and total loans are summed across all issuers before dividing. Every loan has equal weight regardless of deal size. Because large prime issuers hold far more loans than smaller subprime issuers, this rate will be noticeably lower than a simple average across deals.';
    issuerPanel.appendChild(lbl);
    const sep = document.createElement('div'); sep.className = 'multi-sel-sep';
    issuerPanel.appendChild(sep);
  })();

  for (const it of ISSUERS) {
    const lbl = document.createElement('label');
    const cb  = document.createElement('input');
    cb.type = 'checkbox'; cb.value = it.code;
    cb.title = it.code;
    issuerCbs.push(cb);
    cb.addEventListener('change', () => {
      if (cb.checked && displayMode === 'seasonal' && (selectedIssuers.size >= 1 || showAllAvg)) {
        cb.checked = false;
        showToast('Year Overlay supports one issuer at a time. Deselect the current selection first, or use All avg.');
        return;
      }
      if (cb.checked) selectedIssuers.add(it.code);
      else selectedIssuers.delete(it.code);
      syncSelectAll(); updateIssuerBtn(); render();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(' ' + issuerLabel[it.code]));
    issuerPanel.appendChild(lbl);
  }

  function updateIssuerBtn() {
    if (showAllAvg || selectedIssuers.size === ISSUERS.length) {
      issuerBtn.textContent = 'All Issuers ▾';
      return;
    }
    const parts = [];
    for (const c of selectedIssuers) parts.push(issuerLabel[c] || c);
    if (parts.length === 0) {
      issuerBtn.textContent = 'Select issuers ▾';
    } else if (parts.length <= 2) {
      issuerBtn.textContent = parts.join(', ') + ' ▾';
    } else {
      issuerBtn.textContent = parts[0] + ', +' + (parts.length - 1) + ' more ▾';
    }
  }

  function initTsSelection() {
    if (selectedIssuers.size === 0 && !showAllAvg) {
      showAllAvg = true;
      const cb = issuerPanel.querySelector('input[value="__all__"]');
      if (cb) cb.checked = true;
      updateIssuerBtn();
    }
  }

  issuerBtn.addEventListener('click', e => {
    e.stopPropagation();
    issuerPanel.hidden = !issuerPanel.hidden;
  });
  document.addEventListener('click', () => { issuerPanel.hidden = true; });
  issuerPanel.addEventListener('click', e => e.stopPropagation());

  // ── Date dropdowns (vintage) ─────────────────────────────────────────
  const dateFromSel = document.getElementById('dateFrom');
  const dateToSel   = document.getElementById('dateTo');

  function populateDates(sel1, sel2, dates) {
    const sorted = Array.from(new Set(dates)).filter(Boolean).sort();
    for (const sel of [sel1, sel2]) {
      sel.innerHTML = '';
      for (const d of sorted) {
        const o = document.createElement('option');
        o.value = d;
        try {
          const dt = new Date(d + 'T00:00:00');
          o.textContent = dt.toLocaleDateString('en-US', { year:'numeric', month:'short' });
        } catch (_) { o.textContent = d; }
        sel.appendChild(o);
      }
    }
    sel1.value = sorted[0] || '';
    sel2.value = sorted[sorted.length - 1] || '';
  }

  // Time series date dropdowns (separate so they can show all-issuer dates)
  const tsDateFromSel = document.getElementById('tsDateFrom');
  const tsDateToSel   = document.getElementById('tsDateTo');

  // ── CSV loading ──────────────────────────────────────────────────────
  function csvUrl(filename) {
    return `${DATA_BASE}/${filename}?b=${encodeURIComponent(BUILD_ID)}`;
  }

  async function fetchCSV(filename) {
    const resp = await fetch(csvUrl(filename), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status} loading ${filename}`);
    return parseCSV(await resp.text());
  }

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return [];
    const header = lines[0].split(',').map(h => h.trim());
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      if (vals.length < header.length) continue;
      const r = {};
      for (let j = 0; j < header.length; j++) r[header[j]] = (vals[j] ?? '').trim();
      r.vintage_month      = parseInt(r.vintage_month,      10) || 0;
      r.fico_low           = parseInt(r.fico_low,           10) || 0;
      r.fico_high          = parseInt(r.fico_high,          10) || 0;
      r.loan_count_current = parseInt(r.loan_count_current, 10) || 0;
      r.loan_count_30_59   = parseInt(r.loan_count_30_59,   10) || 0;
      r.loan_count_60_plus = parseInt(r.loan_count_60_plus, 10) || 0;
      r.balance            = parseFloat(r.balance)              || 0;
      rows.push(r);
    }
    return rows;
  }

  // Pre-load all-pools summary CSV in background
  summaryPending = fetchCSV('_summary.csv').then(rows => {
    summaryRows  = rows;
    summaryReady = true;
    const dates = rows.map(r => r.reporting_date);
    populateDates(tsDateFromSel, tsDateToSel, dates);
    if (mode === 'timeseries') render();
  }).catch(err => {
    console.warn('Summary CSV failed to load:', err);
    summaryReady = true;
  });

  // Lazy-load seasoned summary (fetched only when user first selects "Seasoned")
  function ensureSeasonedLoaded() {
    if (seasonedPending) return seasonedPending;
    seasonedPending = fetchCSV('_summary_seasoned.csv').then(rows => {
      seasonedRows  = rows;
      seasonedReady = true;
    }).catch(err => {
      console.warn('Seasoned CSV failed to load:', err);
      seasonedReady = true;
    });
    return seasonedPending;
  }

  function activeSummaryRows() {
    return poolMode === 'seasoned' ? seasonedRows : summaryRows;
  }
  function activeSummaryReady() {
    return poolMode === 'seasoned' ? seasonedReady : summaryReady;
  }

  // ── Aggregation helpers ──────────────────────────────────────────────

  // Vintage mode: aggregate across FICO buckets, return per-series rows
  function aggregateVintage(rows) {
    const from = dateFromSel.value || '';
    const to   = dateToSel.value   || '';
    const filtered = rows.filter(r =>
      r.fico_low >= ficoMin && r.fico_low < ficoMax &&
      (!from || r.reporting_date >= from) &&
      (!to   || r.reporting_date <= to)
    );

    const grouped = new Map();
    for (const r of filtered) {
      const key = `${r.series}||${r.reporting_date}||${r.vintage_month}`;
      if (!grouped.has(key)) {
        grouped.set(key, {
          series: shortSeries(r.series), reporting_date: r.reporting_date,
          vintage_month: r.vintage_month, cur: 0, d3059: 0, d60: 0,
        });
      }
      const g = grouped.get(key);
      g.cur   += r.loan_count_current;
      g.d3059 += r.loan_count_30_59;
      g.d60   += r.loan_count_60_plus;
    }
    return Array.from(grouped.values()).map(g => {
      const total = g.cur + g.d3059 + g.d60;
      if (total < 10) return null;
      return {
        series: g.series, reporting_date: g.reporting_date,
        date_label: fmtDateLabel(g.reporting_date),
        vintage_month: g.vintage_month, loan_count: total,
        dq_rate: dqRate(g, total),
      };
    }).filter(Boolean);
  }

  // Normalise an ISO date string to the first day of its month (YYYY-MM-01).
  // This aligns issuers that report on different days of the same month.
  function toMonthStart(dateStr) {
    return dateStr ? dateStr.substring(0, 7) + '-01' : dateStr;
  }
  const _MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDateLabel(dateStr) {
    // "2026-01-01" → "Jan 2026" — pure string, no Date object, no timezone issue
    return _MO[parseInt(dateStr.substring(5, 7), 10) - 1] + ' ' + dateStr.substring(0, 4);
  }

  // Time series mode: aggregate by issuer → one point per (issuer, month)
  function aggregateTimeSeries(rows) {
    const from = toMonthStart(tsDateFromSel.value || '');
    const to   = toMonthStart(tsDateToSel.value   || '');
    const filtered = rows.filter(r => {
      const m = toMonthStart(r.reporting_date);
      return (
        r.fico_low >= ficoMin && r.fico_low < ficoMax &&
        (!from || m >= from) &&
        (!to   || m <= to)
      );
    });

    // Group by (issuer_code, month) — normalise date so all issuers in the
    // same calendar month share the same x-axis position.
    const grouped = new Map();
    for (const r of filtered) {
      const month = toMonthStart(r.reporting_date);
      const key = `${r.issuer_code}||${month}`;
      if (!grouped.has(key)) {
        grouped.set(key, {
          issuer_code: r.issuer_code, reporting_date: month,
          cur: 0, d3059: 0, d60: 0,
        });
      }
      const g = grouped.get(key);
      g.cur   += r.loan_count_current;
      g.d3059 += r.loan_count_30_59;
      g.d60   += r.loan_count_60_plus;
    }

    const result = [];

    // Selected individual issuers
    for (const [key, g] of grouped) {
      if (!selectedIssuers.has(g.issuer_code)) continue;
      const total = g.cur + g.d3059 + g.d60;
      if (total < 10) continue;
      result.push({
        series: issuerLabel[g.issuer_code] || g.issuer_code,
        reporting_date: g.reporting_date,
        date_label: fmtDateLabel(g.reporting_date),
        vintage_month: 0,
        loan_count: total,
        dq_rate: dqRate(g, total),
      });
    }

    // All-issuers weighted average (already month-normalised via grouped keys)
    if (showAllAvg) {
      const byDate = new Map();
      for (const g of grouped.values()) {
        if (!byDate.has(g.reporting_date)) {
          byDate.set(g.reporting_date, { cur:0, d3059:0, d60:0 });
        }
        const agg = byDate.get(g.reporting_date);
        agg.cur   += g.cur;
        agg.d3059 += g.d3059;
        agg.d60   += g.d60;
      }
      for (const [date, agg] of byDate) {
        const total = agg.cur + agg.d3059 + agg.d60;
        if (total < 10) continue;
        result.push({
          series: 'All Issuers',
          reporting_date: date,
          date_label: fmtDateLabel(date),
          vintage_month: 0,
          loan_count: total,
          dq_rate: dqRate(agg, total),
        });
      }
    }

    return result;
  }

  function dqRate(g, total) {
    if      (dqFilter === '60+')    return g.d60 / total;
    else if (dqFilter === '30-59')  return g.d3059 / total;
    else if (dqFilter === 'any-dq') return (g.d3059 + g.d60) / total;
    else                            return g.cur / total;
  }

  // Strip issuer prefix from series name for legend display.
  // Handles: "AART 2017-1" → "2017-1", "Honda Auto ... 2017-1 Owner Trust" → "2017-1",
  //          "ALLY ... 2025- 1" → "2025-1" (normalises mid-token spaces).
  function shortSeries(s) {
    const m = s.match(/\d{4}-\s*[A-Za-z0-9]+/);
    return m ? m[0].replace(/\s/g, '') : s;
  }

  // ── Vega-Lite spec ───────────────────────────────────────────────────
  function buildSpec(data, title) {
    const isVintage = mode === 'vintage';
    const chartType = isVintage ? 'Vintage Curves' : 'Time Series';

    // Y-axis: label and format depend on DQ filter and (for TS) transform
    let yLabel = {
      '60+':'60+ DPD Rate', '30-59':'30–59 DPD Rate',
      'any-dq':'30+ DPD Rate', 'current':'< 30 DPD (Current) Rate',
    }[dqFilter] || 'Rate';
    let yFmt = '.2%';
    if (!isVintage) {
      if (transform === 'yoy-delta') { yLabel = 'YOY Δ (percentage points)'; yFmt = '+.2%'; }
      else if (transform === 'yoy-pct') { yLabel = 'YOY % Change'; yFmt = '+.1%'; }
    }

    // X-axis: vintage uses months; time series uses formatted calendar dates
    const xEnc = isVintage
      ? { field:'vintage_month', type:'quantitative',
           title:'Months Since Issuance', axis:{ tickMinStep:1 } }
      : { field:'reporting_date', type:'temporal', timeUnit:'utcyearmonth', title:'Reporting Date',
           axis:{ tickCount:{utcyear:1}, format:"%Y", labelAngle:0, labelOverlap:false } };

    const subtitle = isVintage
      ? 'Months since deal issuance · click legend to highlight'
      : (poolMode === 'seasoned' ? 'Seasoned pools (>6 mo) · click legend to highlight'
                                 : 'All pools · click legend to highlight');

    const colorEnc = {
      "field":"series","type":"nominal","title":"Series",
      "legend":{
        "orient":"bottom","direction":"horizontal",
        "columns":8,"labelLimit":90,"symbolSize":110,"symbolLimit":1000,
      },
    };
    const colorEncNoLegend = {"field":"series","type":"nominal","legend":null};
    const yEnc = {
      "field":"dq_rate","type":"quantitative","title":yLabel,
      "axis":{"format":yFmt},
    };
    const tooltipEnc = [
      {"field":"series","type":"nominal","title":"Series"},
      {"field":"date_label","type":"nominal","title":"Date"},
      {"field":"dq_rate","type":"quantitative","title":yLabel,"format":yFmt},
    ];

    return {
      "$schema":"https://vega.github.io/schema/vega-lite/v5.json",
      "autosize": {"type":"fit","contains":"padding"},
      "config": {
        "axis":  {"labelFontSize":13,"titleFontSize":14},
        "title": {"anchor":"middle","fontSize":15,"subtitleFontSize":11},
        "view":  {"continuousHeight":300,"continuousWidth":300},
        "tooltip": {"theme":"light"},
      },
      "data":   {"values": data},
      "width":  "container",
      "height": "container",
      "title":  {"text": `${title} — ${chartType}`, "subtitle": subtitle},
      "layer": [
        {
          // Layer 1: lines + legend-bind selection
          "params": [{
            "name":"Series","bind":"legend",
            "select": {"type":"point","fields":["series"],"toggle":true,"clear":false},
          }],
          "mark": {"type":"line"},
          "encoding": {
            "x": xEnc,
            "y": yEnc,
            "color": colorEnc,
            "opacity": {
              "condition":{"param":"Series","empty":true,"value":1.0},
              "value":0.25,
            },
            "size": {
              "condition": [
                {"test":"datum.series === 'All Issuers'","value":4.0},
                {"param":"Series","empty":false,"value":3.0},
              ],
              "value":1.5,
            },
          },
        },
        {
          // Layer 2: large invisible circles — nearest:true captures hover
          // anywhere close to a data point without triggering across the whole chart
          "params": [{
            "name":"hover",
            "select":{"type":"point","nearest":true,"on":"mouseover","clear":"mouseout"},
          }],
          "mark": {"type":"circle","opacity":0,"size":900},
          "encoding": {
            "x": xEnc,
            "y": yEnc,
            "color": colorEncNoLegend,
          },
        },
        {
          // Layer 3: visible dot + tooltip — appears only on hovered point
          "mark": {"type":"point","filled":true,"size":90,"strokeWidth":1.5},
          "encoding": {
            "x": xEnc,
            "y": yEnc,
            "color": colorEncNoLegend,
            "stroke": colorEncNoLegend,
            "opacity": {"condition":{"param":"hover","empty":false,"value":1},"value":0},
            "tooltip": tooltipEnc,
          },
        },
        {
          // Layer 4: vertical crosshair at hovered point
          "transform": [{"filter":{"param":"hover","empty":false}}],
          "mark": {"type":"rule","color":"#94a3b8","strokeWidth":1,"strokeDash":[3,3]},
          "encoding": {"x": xEnc},
        },
      ],
    };
  }

  // ── YOY transform ────────────────────────────────────────────────────
  function applyTransform(data) {
    if (transform === 'rate') return data;
    // Build lookup: series → month-start-date → dq_rate
    const lookup = new Map();
    for (const d of data) {
      if (!lookup.has(d.series)) lookup.set(d.series, new Map());
      lookup.get(d.series).set(d.reporting_date, d.dq_rate);
    }
    return data.map(d => {
      const dt = new Date(d.reporting_date + 'T00:00:00');
      dt.setFullYear(dt.getFullYear() - 1);
      const prior = lookup.get(d.series)?.get(dt.toISOString().substring(0,7) + '-01');
      if (prior == null) return null;
      const value = transform === 'yoy-delta'
        ? d.dq_rate - prior
        : (prior === 0 ? null : (d.dq_rate - prior) / prior);
      return value == null ? null : { ...d, dq_rate: value };
    }).filter(Boolean);
  }

  // ── Annual table helpers ─────────────────────────────────────────────
  function aggregateAnnual(monthlyData) {
    // Average each series' monthly dq_rate values within each calendar year
    const map = new Map();
    for (const d of monthlyData) {
      const year = d.reporting_date.substring(0, 4);
      const key  = d.series + '::' + year;
      if (!map.has(key)) map.set(key, { series:d.series, year, sum:0, count:0 });
      const e = map.get(key);
      e.sum += d.dq_rate; e.count++;
    }
    return [...map.values()]
      .map(e => ({ series:e.series, year:e.year, dq_rate: e.sum / e.count }))
      .sort((a,b) => a.series.localeCompare(b.series) || a.year.localeCompare(b.year));
  }

  function aggregateAnnualYoyPct(rawMonthlyData) {
    // YOY % on annual averages: (avg_N - avg_N1) / avg_N1
    // For partial years, only matched months are used (same months in both years).
    const rateLookup = new Map(); // series → month (YYYY-MM-01) → rate
    for (const d of rawMonthlyData) {
      if (!rateLookup.has(d.series)) rateLookup.set(d.series, new Map());
      rateLookup.get(d.series).set(d.reporting_date, d.dq_rate);
    }
    // Group available months by (series, year)
    const yearMap = new Map();
    for (const d of rawMonthlyData) {
      const year = d.reporting_date.substring(0, 4);
      const key  = d.series + '::' + year;
      if (!yearMap.has(key)) yearMap.set(key, { series:d.series, year, months:[] });
      yearMap.get(key).months.push(d.reporting_date);
    }
    return [...yearMap.values()].map(({ series, year, months }) => {
      const priorYear = String(+year - 1);
      // Keep only months that have a matching month in the prior year
      const matched = months.filter(m => rateLookup.get(series)?.has(priorYear + m.substring(4)));
      if (!matched.length) return null;
      const avgCurrent = matched.reduce((s, m) => s + rateLookup.get(series).get(m), 0) / matched.length;
      const avgPrior   = matched.reduce((s, m) => s + rateLookup.get(series).get(priorYear + m.substring(4)), 0) / matched.length;
      if (avgPrior === 0) return null;
      return { series, year, dq_rate: (avgCurrent - avgPrior) / avgPrior };
    }).filter(Boolean)
      .sort((a,b) => a.series.localeCompare(b.series) || a.year.localeCompare(b.year));
  }

  function renderTable(annualData, yFmt, monthlyData, title) {
    _lastTableArgs = {annualData, yFmt, monthlyData, title};
    const isYoy  = transform !== 'rate';
    const vis     = document.getElementById('vis');
    const tblWrap = document.getElementById('tblWrap');
    vis.style.display     = 'none';
    tblWrap.style.display = 'block';
    const poolLabel = poolMode === 'seasoned' ? 'Seasoned pools (>6 mo)' : 'All pools';
    const transformNote = transform === 'yoy-delta'
      ? 'each row = calendar-year avg of monthly rates; change = year N minus year N−1 (pp)'
      : transform === 'yoy-pct'
      ? 'each row = calendar-year avg of monthly rates; change = (year N ÷ year N−1) − 1; partial years compare only matched months'
      : 'annual averages of monthly readings';
    const subtitle = `${poolLabel} · ${transformNote}`;
    let headerHtml = `<div class="tbl-title">${title || 'Issuer Comparison'} — Time Series</div>`
                   + `<div class="tbl-subtitle">${subtitle}</div>`;

    // ── Heatmap legend (shown/hidden by toggle; id used by listener below) ──
    const legendInner = isYoy
      ? '<span>Improving</span>'
        + '<div style="width:140px;height:10px;border-radius:3px;'
        + 'background:linear-gradient(to right,rgba(0,210,0,0.45),rgba(255,255,255,0.8),rgba(255,80,80,0.45));'
        + 'border:1px solid var(--border);flex-shrink:0;"></div>'
        + '<span>Worsening</span>'
      : '<span>Lower DQ</span>'
        + '<div style="width:140px;height:10px;border-radius:3px;'
        + 'background:linear-gradient(to right,rgba(255,255,255,0.9),rgba(255,89,89,0.5));'
        + 'border:1px solid var(--border);flex-shrink:0;"></div>'
        + '<span>Higher DQ</span>';
    headerHtml += '<div id="heatmapLegend" style="display:'
      + (heatmapEnabled ? 'flex' : 'none')
      + ';align-items:center;gap:8px;padding:2px 4px 8px;font-size:10.5px;color:var(--muted);">'
      + legendInner + '</div>';

    // Collect unique years (columns) and series (rows)
    const yearsSet  = new Set(), seriesSet = new Set();
    for (const d of annualData) { yearsSet.add(d.year); seriesSet.add(d.series); }
    const years  = [...yearsSet].sort().filter(yr => yr !== '2016');
    const series = [...seriesSet].sort();

    // Build lookup: series → year → value
    const lookup = new Map();
    for (const d of annualData) {
      if (!lookup.has(d.series)) lookup.set(d.series, new Map());
      lookup.get(d.series).set(d.year, d.dq_rate);
    }

    // Compute per-column min/max for heat-map scaling
    const colMin = {}, colMax = {};
    for (const yr of years) {
      const vals = series.map(s => lookup.get(s)?.get(yr)).filter(v => v != null);
      colMin[yr] = Math.min(...vals);
      colMax[yr] = Math.max(...vals);
    }

    // Heat-map colour helper
    function cellBg(val, yr) {
      if (!heatmapEnabled) return '';
      if (val == null) return '';
      const lo = colMin[yr], hi = colMax[yr];
      if (lo === hi) return '';
      const t = (val - lo) / (hi - lo); // 0=best, 1=worst
      if (isYoy) {
        // Diverging: negative = green, positive = red
        const sign = val < 0 ? -1 : 1;
        const abs  = Math.min(Math.abs(val / (hi - lo + 1e-9)), 1);
        const r = sign > 0 ? Math.round(255) : Math.round(255 * (1 - abs * 0.6));
        const g = sign < 0 ? Math.round(255) : Math.round(255 * (1 - abs * 0.6));
        const b = Math.round(255 * (1 - abs * 0.4));
        return `rgba(${r},${g},${b},0.45)`;
      } else {
        // Sequential: low = white, high = red
        const r = 255, g = Math.round(255 * (1 - t * 0.65)), bv = Math.round(255 * (1 - t * 0.65));
        return `rgba(${r},${g},${bv},0.5)`;
      }
    }

    // Format helper
    const fmtVal = (v) => {
      if (v == null) return '—';
      if (yFmt === '+.2%') return (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + ' pp';
      if (yFmt === '+.1%') return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
      return (v * 100).toFixed(2) + '%';
    };

    // Detect partial years (< 12 distinct months in the source monthly data)
    const mpy = {};
    for (const d of (monthlyData || [])) {
      const yr = d.reporting_date.substring(0, 4);
      if (!mpy[yr]) mpy[yr] = new Set();
      mpy[yr].add(d.reporting_date.substring(0, 7)); // "YYYY-MM"
    }
    const partialYears = new Set(years.filter(yr => mpy[yr] && mpy[yr].size < 12));
    const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtYM(ym) { const [y,m] = ym.split('-'); return MO[+m-1] + ' ' + y; }

    // Build table HTML
    let html = '<table><thead><tr><th class="row-hdr">Series</th>';
    for (const yr of years) {
      const mark = partialYears.has(yr) ? `<sup style="font-size:9px;">†</sup>` : '';
      html += `<th>${yr}${mark}</th>`;
    }
    html += '</tr></thead><tbody>';
    for (const s of series) {
      html += `<tr><td class="row-hdr">${s}</td>`;
      for (const yr of years) {
        const val = lookup.get(s)?.get(yr);
        const bg  = cellBg(val, yr);
        html += `<td style="${bg ? 'background:' + bg : ''}">${fmtVal(val)}</td>`;
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    if (partialYears.size) {
      const notes = [...partialYears].sort().map(yr => {
        const lastMo = fmtYM([...mpy[yr]].sort().pop());
        const priorYr = String(+yr - 1);
        return isYoy
          ? `<b>${yr}</b>: YTD through ${lastMo}; change vs. same period in ${priorYr}`
          : `<b>${yr}</b>: YTD average through ${lastMo}`;
      });
      html += `<p style="font-size:11px;color:var(--muted);margin:8px 4px 12px;">` +
        `<sup style="font-size:9px;">†</sup> Partial year — ${notes.join(' · ')}</p>`;
    }
    tblWrap.innerHTML = headerHtml + html;

    // Sync legend visibility with current heatmapEnabled state
    const legend = document.getElementById('heatmapLegend');
    if (legend) legend.style.display = heatmapEnabled ? 'flex' : 'none';
  }

  // ── Render ───────────────────────────────────────────────────────────
  function showMsg(text, isErr) {
    document.getElementById('vis').innerHTML =
      `<div class="loading${isErr?' err':''}">${text}</div>`;
    document.getElementById('tblWrap').style.display = 'none';
    document.getElementById('vis').style.display = 'block';
  }

  async function render() {
    if (mode === 'vintage') {
      if (!vintageRows.length) return;
      const code = issuerSel.value;
      const data = aggregateVintage(vintageRows);
      if (!data.length) { showMsg('No data for selected filters.'); return; }
      const title = issuerLabel[code] || code;
      renderChart(data, title);

    } else {
      if (!activeSummaryReady()) { showMsg('Loading summary data…'); return; }
      if (!activeSummaryRows().length) { showMsg('Summary data unavailable.', true); return; }
      if (selectedIssuers.size === 0 && !showAllAvg) {
        showMsg('Select at least one issuer chip above to draw a chart.');
        return;
      }
      const rawData = aggregateTimeSeries(activeSummaryRows());
      if (!rawData.length) { showMsg('No data for selected filters.'); return; }
      const data = applyTransform(rawData);
      if (!data.length) { showMsg('No data — YOY transforms require 12+ months of history.'); return; }
      const title = selectedIssuers.size === 1 && !showAllAvg
        ? issuerLabel[[...selectedIssuers][0]] || [...selectedIssuers][0]
        : 'Issuer Comparison';
      if (displayMode === 'table') {
        let yFmt = '.2%';
        if (transform === 'yoy-delta') yFmt = '+.2%';
        else if (transform === 'yoy-pct') yFmt = '+.1%';
        // yoy-pct: compute on annual averages to avoid "average of ratios" distortion
        const annualData = transform === 'yoy-pct'
          ? aggregateAnnualYoyPct(rawData)
          : aggregateAnnual(data);
        if (!annualData.length) { showMsg('No data — YOY requires 12+ months of history.'); return; }
        renderTable(annualData, yFmt, rawData, title);
      } else if (displayMode === 'seasonal') {
        const seasonalData = aggregateSeasonal(rawData);
        if (!seasonalData.length) { showMsg('No data for selected filters.'); return; }
        renderSeasonalChart(seasonalData, title);
      } else {
        renderChart(data, title);
      }
    }
  }

  async function renderChart(data, title) {
    document.getElementById('tblWrap').style.display = 'none';
    document.getElementById('vis').style.display = 'block';
    document.getElementById('vis').innerHTML = '';
    try {
      await vegaEmbed('#vis', buildSpec(data, title), { actions:false, renderer:'svg' });
    } catch (err) {
      showMsg('Chart failed: ' + String(err), true);
    }
  }

  // ── Seasonal aggregation: collapse series → (year, month) ────────────
  function aggregateSeasonal(rawData) {
    const byYearMonth = new Map();
    for (const d of rawData) {
      const year      = d.reporting_date.substring(0, 4);
      const month_num = parseInt(d.reporting_date.substring(5, 7), 10);
      const key       = year + '-' + String(month_num).padStart(2, '0');
      if (!byYearMonth.has(key))
        byYearMonth.set(key, { year, month_num, loans: 0, wsum: 0 });
      const g = byYearMonth.get(key);
      g.loans += d.loan_count;
      g.wsum  += d.dq_rate * d.loan_count;
    }
    return [...byYearMonth.values()]
      .map(g => ({
        year:        g.year,
        month_num:   g.month_num,
        month_label: _MO[g.month_num - 1],
        dq_rate:     g.loans > 0 ? g.wsum / g.loans : 0,
      }))
      .sort((a, b) => a.year.localeCompare(b.year) || a.month_num - b.month_num);
  }

  async function renderSeasonalChart(data, title) {
    document.getElementById('tblWrap').style.display = 'none';
    document.getElementById('vis').style.display = 'block';
    document.getElementById('vis').innerHTML = '';
    const yLabel = dqFilter === '60+'    ? '60+ DPD Rate'
                 : dqFilter === '30-59'  ? '30–59 DPD Rate'
                 : dqFilter === 'any-dq' ? '30+ DPD Rate'
                 :                        '< 30 DPD (Current) Rate';
    const poolLabel = poolMode === 'seasoned' ? 'Seasoned pools (>6 mo)' : 'All pools';
    const clrSeasonal = {"field":"year","type":"ordinal","scale":{"scheme":"tableau10"}};
    const clrSeasonalNoLeg = {...clrSeasonal, "legend":null};
    const xSeasonal = {
      "field":"month_num","type":"ordinal","title":"Month",
      "axis":{"labelExpr":"['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][datum.value - 1]",
               "labelAngle":0},
    };
    const xSeasonalNoAxis = {"field":"month_num","type":"ordinal"};
    const ySeasonal = {"field":"dq_rate","type":"quantitative","title":yLabel,"axis":{"format":".2%"}};
    const ySeasonalNoAxis = {"field":"dq_rate","type":"quantitative"};
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "autosize": {"type":"fit","contains":"padding"},
      "config": {
        "axis":  {"labelFontSize":13,"titleFontSize":14},
        "title": {"anchor":"middle","fontSize":15,"subtitleFontSize":11},
        "view":  {"continuousHeight":300,"continuousWidth":300},
      },
      "data":   {"values": data},
      "width":  "container",
      "height": "container",
      "title":  {"text": `${title} — Year Overlay`,
                 "subtitle": `${poolLabel} · each line = one calendar year · click legend to highlight`},
      "layer": [
        // Layer 1: lines + legend-bind year selection
        {
          "params": [{"name":"Yr","bind":"legend",
                      "select":{"type":"point","fields":["year"],"toggle":true,"clear":false}}],
          "mark": {"type":"line"},
          "encoding": {
            "x": xSeasonal,
            "y": ySeasonal,
            "color": {...clrSeasonal,"title":"Year",
                      "legend":{"orient":"bottom","direction":"horizontal","columns":8,
                                "symbolSize":110,"labelLimit":80}},
            "opacity": {"condition":{"param":"Yr","empty":true,"value":1.0},"value":0.2},
            "size":    {"condition":{"param":"Yr","empty":false,"value":3.0},"value":1.5},
          },
        },
        // Layer 2: large invisible circles for nearest-point hover detection
        {
          "params": [{"name":"hvr","select":{"type":"point","nearest":true,"on":"mouseover","clear":"mouseout"}}],
          "mark": {"type":"circle","opacity":0,"size":900},
          "encoding": {
            "x": xSeasonalNoAxis,
            "y": ySeasonalNoAxis,
            "color": clrSeasonalNoLeg,
          },
        },
        // Layer 3: visible dot + tooltip, shown only on hover
        {
          "mark": {"type":"point","filled":true,"size":90,"strokeWidth":1.5},
          "encoding": {
            "x":      xSeasonalNoAxis,
            "y":      ySeasonalNoAxis,
            "color":  clrSeasonalNoLeg,
            "stroke": clrSeasonalNoLeg,
            "opacity": {"condition":{"param":"hvr","empty":false,"value":1},"value":0},
            "tooltip": [
              {"field":"year","type":"ordinal","title":"Year"},
              {"field":"month_label","type":"nominal","title":"Month"},
              {"field":"dq_rate","type":"quantitative","title":yLabel,"format":".2%"},
            ],
          },
        },
        // Layer 4: vertical crosshair at hovered month
        {
          "transform": [{"filter":{"param":"hvr","empty":false}}],
          "mark": {"type":"rule","color":"#94a3b8","strokeWidth":1,"strokeDash":[3,3]},
          "encoding": {"x": xSeasonalNoAxis},
        },
      ],
    };
    try {
      await vegaEmbed('#vis', spec, { actions:false, renderer:'svg' });
    } catch (err) {
      showMsg('Chart failed: ' + String(err), true);
    }
  }

  // ── Load vintage issuer ──────────────────────────────────────────────
  async function loadVintageAndRender() {
    const code = issuerSel.value;
    if (!code) return;
    showMsg('Loading…');
    try {
      vintageRows = await fetchCSV(`${code}.csv`);
      if (!vintageRows.length) { showMsg('No data for this issuer.'); return; }
      populateDates(
        dateFromSel, dateToSel,
        vintageRows.map(r => r.reporting_date)
      );
      await render();
    } catch (err) {
      showMsg('Failed to load: ' + String(err), true);
    }
  }

  // ── Mode switching ───────────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.body.dataset.mode = m;
    for (const b of document.querySelectorAll('#modeGroup .mode-tab'))
      b.classList.toggle('active', b.dataset.mode === m);
    const _u = new URL(window.location.href);
    _u.searchParams.set('view', m);
    history.pushState({}, '', _u);
    if (m === 'timeseries') {
      initTsSelection();
      render();
    } else {
      render();
    }
  }

  // ── Event listeners ──────────────────────────────────────────────────
  document.getElementById('modeGroup').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (b) setMode(b.dataset.mode);
  });

  // DQ Status dropdown
  const dqSel = document.getElementById('dqSel');
  dqSel.value = dqFilter;
  dqSel.addEventListener('change', () => { dqFilter = dqSel.value; render(); });

  // Credit Score dropdown + optional custom range
  const scoreSel    = document.getElementById('scoreSel');
  const scoreCustom = document.getElementById('scoreCustom');
  scoreSel.addEventListener('change', () => {
    const p = scoreSel.value;
    if (p === 'all')      { ficoMin=300; ficoMax=900; }
    if (p === 'subprime') { ficoMin=300; ficoMax=660; }
    if (p === 'prime')    { ficoMin=660; ficoMax=900; }
    scoreCustom.style.display = (p === 'custom') ? 'flex' : 'none';
    if (p !== 'custom') render();
  });

  document.getElementById('ficoLow').addEventListener('change', e => {
    ficoMin = parseInt(e.target.value, 10);
    if (ficoMin >= ficoMax) { ficoMax=ficoMin+10; document.getElementById('ficoHigh').value=ficoMax; }
    scoreSel.value = 'custom'; scoreCustom.style.display = 'flex';
    render();
  });

  document.getElementById('ficoHigh').addEventListener('change', e => {
    ficoMax = parseInt(e.target.value, 10);
    if (ficoMax <= ficoMin) { ficoMin=ficoMax-10; document.getElementById('ficoLow').value=ficoMin; }
    scoreSel.value = 'custom'; scoreCustom.style.display = 'flex';
    render();
  });

  issuerSel.addEventListener('change', loadVintageAndRender);
  dateFromSel.addEventListener('change', () => render());
  dateToSel.addEventListener('change',   () => render());
  tsDateFromSel.addEventListener('change', () => render());
  tsDateToSel.addEventListener('change',   () => render());

  const transformSel = document.getElementById('transformSel');
  if (transformSel) {
    function syncTransformTitle() {
      const opt = transformSel.options[transformSel.selectedIndex];
      transformSel.title = opt ? (opt.title || '') : '';
    }
    transformSel.addEventListener('change', () => { transform = transformSel.value; syncTransformTitle(); render(); });
    syncTransformTitle();
  }

  // ── Heatmap toggle switch (in filter bar, visible only in Table view) ──
  (function() {
    const chk    = document.getElementById('heatmapToggle');
    const lbl    = document.getElementById('hmLabel');
    const ctrl   = document.getElementById('hmCtrl');
    const sep    = document.getElementById('hmSep');
    if (!chk) return;
    chk.checked = heatmapEnabled;
    chk.addEventListener('change', function() {
      heatmapEnabled = this.checked;
      if (lbl) lbl.textContent = heatmapEnabled ? 'On' : 'Off';
      const legend = document.getElementById('heatmapLegend');
      if (legend) legend.style.display = heatmapEnabled ? 'flex' : 'none';
      // Re-colour cells without full re-render
      if (_lastTableArgs) {
        const tbl = document.querySelector('#tblWrap table');
        if (tbl) {
          const rows = tbl.querySelectorAll('tbody tr');
          const {annualData} = _lastTableArgs;
          // Rebuild lookup + colMin/colMax inline
          const lu = new Map();
          for (const d of annualData) {
            if (!lu.has(d.series)) lu.set(d.series, new Map());
            lu.get(d.series).set(d.year, d.dq_rate);
          }
          const seriesArr = [...new Set(annualData.map(d => d.series))].sort();
          const yearsArr  = [...new Set(annualData.map(d => d.year))].sort().filter(y => y !== '2016');
          const cMin = {}, cMax = {};
          for (const yr of yearsArr) {
            const vals = seriesArr.map(s => lu.get(s)?.get(yr)).filter(v => v != null);
            cMin[yr] = Math.min(...vals); cMax[yr] = Math.max(...vals);
          }
          const isYoyLocal = transform !== 'rate';
          rows.forEach((tr, ri) => {
            const s = seriesArr[ri];
            tr.querySelectorAll('td:not(.row-hdr)').forEach((td, ci) => {
              const yr  = yearsArr[ci];
              const val = lu.get(s)?.get(yr);
              if (!heatmapEnabled || val == null) { td.style.background = ''; return; }
              const lo = cMin[yr], hi = cMax[yr];
              if (lo === hi) { td.style.background = ''; return; }
              const t = (val - lo) / (hi - lo);
              let bg;
              if (isYoyLocal) {
                const sign = val < 0 ? -1 : 1;
                const abs  = Math.min(Math.abs(val / (hi - lo + 1e-9)), 1);
                const r = sign > 0 ? 255 : Math.round(255*(1-abs*0.6));
                const g = sign < 0 ? 255 : Math.round(255*(1-abs*0.6));
                const b = Math.round(255*(1-abs*0.4));
                bg = `rgba(${r},${g},${b},0.45)`;
              } else {
                const g2 = Math.round(255*(1-t*0.65)), bv = Math.round(255*(1-t*0.65));
                bg = `rgba(255,${g2},${bv},0.5)`;
              }
              td.style.background = bg;
            });
          });
        }
      }
    });
  })();

  document.getElementById('displayGroup').addEventListener('click', e => {
    const b = e.target.closest('button[data-display]');
    if (!b) return;
    displayMode = b.dataset.display;
    // Show/hide heat map control in filter bar
    const ctrl = document.getElementById('hmCtrl');
    const sep  = document.getElementById('hmSep');
    if (ctrl) ctrl.style.display = displayMode === 'table' ? '' : 'none';
    if (sep)  sep.style.display  = displayMode === 'table' ? '' : 'none';

    const showAllRow = document.getElementById('showAllRow');
    if (showAllRow) showAllRow.style.display = (displayMode === 'seasonal') ? 'none' : '';

    if (displayMode === 'seasonal') {
      // Year Overlay: always reset to All Issuers aggregate, hide Show All Issuers
      for (const code of [...selectedIssuers]) {
        selectedIssuers.delete(code);
        const cb = issuerPanel.querySelector(`input[value="${code}"]`);
        if (cb) cb.checked = false;
      }
      syncSelectAll();
      showAllAvg = true;
      const allCb = issuerPanel.querySelector('input[value="__all__"]');
      if (allCb) allCb.checked = true;
      updateIssuerBtn();
    } else if (displayMode === 'table') {
      // Table: always default to all issuers selected
      showAllAvg = false;
      const allCb2 = issuerPanel.querySelector('input[value="__all__"]');
      if (allCb2) allCb2.checked = false;
      for (const cb of issuerCbs) { cb.checked = true; selectedIssuers.add(cb.value); }
      syncSelectAll(); updateIssuerBtn();
    }

    for (const btn of document.querySelectorAll('#displayGroup button'))
      btn.classList.toggle('active', btn.dataset.display === displayMode);
    render();
  });

  document.getElementById('poolGroup').addEventListener('click', async e => {
    const b = e.target.closest('button[data-pool]');
    if (!b) return;
    poolMode = b.dataset.pool;
    for (const btn of document.querySelectorAll('#poolGroup button'))
      btn.classList.toggle('active', btn.dataset.pool === poolMode);
    if (poolMode === 'seasoned' && !seasonedPending) {
      showMsg('Loading seasoned data…');
      await ensureSeasonedLoaded();
    }
    render();
  });

  // ── Methodology popover ──────────────────────────────────────────────
  (function() {
    const btn     = document.getElementById('infoBtn');
    const popover = document.getElementById('infoPopover');
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const hidden = popover.hidden;
      popover.hidden = !hidden;
      if (!hidden) return;
      const br = btn.getBoundingClientRect();
      const pr = document.getElementById('sharedBar').getBoundingClientRect();
      popover.style.top   = (br.bottom - pr.top + 6) + 'px';
      popover.style.right = '0px';
    });
    document.addEventListener('click', () => { popover.hidden = true; });
    popover.addEventListener('click', e => e.stopPropagation());
  })();

  // ── Init ─────────────────────────────────────────────────────────────
  const _initView = new URLSearchParams(window.location.search).get('view');
  if (_initView === 'timeseries') {
    setMode('timeseries');
  } else {
    document.body.dataset.mode = 'vintage';
    loadVintageAndRender();
  }

})();

function exportExplorer() {
  _playShutter();
  var el  = document.getElementById('export-region');
  var md  = document.body.dataset.mode || 'vintage';
  var dt  = new Date().toISOString().slice(0, 10);
  var btn = document.getElementById('export-btn');
  btn.style.display = 'none';
  htmlToImage.toPng(el, {pixelRatio:2, backgroundColor:'#ffffff'})
    .then(function(url) {
      btn.style.display = '';
      var a = document.createElement('a');
      a.href = url; a.download = 'ccm-abs-explorer-' + md + '-' + dt + '.png'; a.click();
    })
    .catch(function(e) {
      btn.style.display = '';
      console.error('PNG export failed:', e);
    });
}
</script>
