  <style>
    /* Local token aliases — map page-specific names to shared design system. */
    :root {
      --text:    var(--color-text);
      --muted:   var(--color-muted);
      --border:  var(--color-border);
      --bg:      var(--color-surface);
      --accent:  var(--color-accent-strong);
      --btn-bg:  #f3f4f6;
    }
    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--text); height:100%;
    }
    body { display:flex; flex-direction:column; overflow:hidden;
           padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
    .wrap { flex:1; display:flex; flex-direction:column; max-width:1200px; width:100%;
            margin:0 auto; padding:10px 14px 32px; overflow:auto; }
    .hdr { display:flex; align-items:center; gap:12px; padding-bottom:8px;
           border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .brand { flex:1; }
    .brand-title { font-size:15px; font-weight:600; }
    .brand-sub { font-size:11px; color:var(--muted); margin-top:1px; }
    .meta-date { font-size:11.5px; color:var(--muted); white-space:nowrap; }
    .mode-tabs { display:flex; border-bottom:2px solid var(--border); flex-shrink:0;
                 margin:0 -14px; padding:0 14px; }
    .mode-tab { background:transparent; border:none; border-bottom:2px solid transparent;
                font-size:13.5px; padding:8px 16px; cursor:pointer; color:var(--muted);
                margin-bottom:-2px; }
    .mode-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .mode-tab:hover:not(.active) { color:var(--text); background:#f9fafb; }
    .fbar { display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 14px;
            padding:7px 0; border-bottom:1px solid var(--border); }
    .ctrl { display:flex; flex-direction:column; gap:3px; }
    label.lbl { font-size:11px; color:var(--muted); font-weight:500; white-space:nowrap; }
    .meta-note { font-size:10.5px; color:var(--muted); font-weight:400; }
    select { font-size:12.5px; padding:4px 7px; border:1px solid var(--border);
             border-radius:6px; background:#fff; }
    .btn-group { display:inline-flex; border:1px solid var(--border); border-radius:6px;
                 overflow:hidden; }
    .btn-group button { border:none; background:var(--btn-bg); font-size:12px;
                        padding:4px 9px; cursor:pointer; color:var(--text);
                        transition:background 0.12s; }
    .btn-group button.active { background:#dbeafe; color:#1e40af; }
    .btn-group button:hover:not(.active) { background:#e5e7eb; }
    .bar-sep { width:1px; background:var(--border); align-self:stretch; margin:2px 8px; flex-shrink:0; }
    #vis { flex:1; width:100%; min-height:400px; margin-bottom:4px; }
    .vega-embed { width:100% !important; height:100% !important; }
    .vega-embed > div { height:100% !important; }
    html, body { touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    #vis, .vega-embed { touch-action: pan-y; }
    #vis svg, #vis canvas, .vega-embed svg, .vega-embed canvas { touch-action: pan-y; }
    #vis { opacity:0; transform:translateY(6px);
           transition:opacity 500ms ease-out, transform 500ms ease-out; }
    #vis.chart-visible { opacity:1; transform:translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      #vis { opacity:1; transform:none; transition:none; }
    }
    .loading { padding:20px; font-size:13px; color:var(--muted); }
    .err { color:#dc2626; }
    .vintage-only, .ts-only { display:none; }
    body[data-sub="vintage"] .vintage-only { display:flex; }
    body[data-sub="timeseries"] .ts-only { display:flex; }
    #source-bar { flex-shrink:0; padding:8px 0 6px; margin-top:6px;
                  border-top:1px solid var(--border); font-size:11px;
                  color:var(--muted); line-height:1.4; }
    /* .multi-sel*  styles inherited from shared style.css */
    /* ── Narrow viewports (all phones + tablets): release the desktop
          body-as-scroll-container so the iframe parent's scroll engages
          naturally and the page doesn't trap touch scrolls in .wrap.
          Without this rule the parent Squarespace shell rubber-bands at
          the bottom of the chart because body overflow:hidden blocks the
          scroll gesture from reaching the iframe boundary. Matches the
          pattern used by generate_sec_explorer_data.py (auto-loan). ──── */
    @media (max-width: 1000px) {
      html, body {
        overflow-x: clip !important;
        overflow-y: visible !important;
        height: auto !important;
      }
      .wrap {
        overflow: visible !important;
        height: auto;
        min-height: 0;
      }
      /* Cap #vis height — with body unconstrained, flex:1 + Vega's
         height:100% would expand unbounded and distort the chart
         (ResizeObserver feedback loop). */
      #vis { flex: none !important; height: 380px; min-height: 320px; max-height: 440px; }
    }
    @media (max-width: 720px) {
      .mode-tab { padding:6px 12px; font-size:12px; min-height:36px; }
      .brand-title { font-size:14px; }
      .fbar { gap:4px 10px; }
    }
    /* ── Mobile portrait — wrap padding (incl. safe-area) and tighter
          chart height. Mirrors auto-loan explorer's portrait block. ── */
    @media (max-width: 640px) {
      body { overflow-y: auto; }
      .wrap { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
      #vis { height: 420px; max-height: 480px; }
    }
    /* ── Landscape phones (viewport height < 500px). The auto-loan explorer
          had this block; the lease page was missing it, so in landscape the
          chart stayed full-size and crowded the short viewport. Reset the
          iPhone safe-area side padding, hide control labels, and shrink the
          chart so it doesn't fill the whole screen. ── */
    @media (max-height: 500px) and (orientation: landscape) {
      html, body { padding-left: 0 !important; padding-right: 0 !important; }
      .hdr { padding-bottom: 4px; gap: 6px; }
      .fbar { padding: 4px 0; gap: 4px 10px; }
      label.lbl { display: none; }
      .mode-tab { padding: 6px 12px; font-size: 12px; min-height: 36px; }
      .wrap { padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); }
      #vis { min-height: 200px; height: 240px; }
      select, .multi-sel-btn { min-height: 36px; padding: 6px 10px; }
      .btn-group button { min-height: 36px; padding: 6px 10px; }
      #source-bar { padding: 4px 0 2px; font-size: 10px; }
    }
  </style>

// Wrap vegaEmbed to add fade-in animation on each render
(function () {
  if (!window.vegaEmbed) return;
  const _orig = window.vegaEmbed;
  window.vegaEmbed = function (target, spec, opts) {
    const el = typeof target === 'string' ? document.querySelector(target) : target;
    if (el) el.classList.remove('chart-visible');
    return _orig(target, spec, opts).then(res => {
      if (el) requestAnimationFrame(() => el.classList.add('chart-visible'));
      return res;
    });
  };
})();

// Tier 1 (localStorage) + Tier 2 (URL) persistence.
// Persists: dq, mode (vintage vs timeseries), single-issuer dropdown
// (vintage mode), multi-issuer checkboxes + All-Issuers toggle (timeseries).
function _saveLeaseState() {
  try {
    localStorage.setItem('ccm_lease_state', JSON.stringify({
      dq: dqFilter,
      mode: mode,
      issuer: selectedIssuer,
      issuers: [...selectedIssuers],
      allAvg: showAllAvg
    }));
  } catch (_e) {}
  try {
    const _u = new URL(window.location.href);
    if (dqFilter) _u.searchParams.set('dq', dqFilter); else _u.searchParams.delete('dq');
    if (mode && mode !== 'vintage') _u.searchParams.set('mode', mode); else _u.searchParams.delete('mode');
    if (selectedIssuer) _u.searchParams.set('issuer', selectedIssuer); else _u.searchParams.delete('issuer');
    if (selectedIssuers.size > 0) _u.searchParams.set('issuers', [...selectedIssuers].join(','));
    else _u.searchParams.delete('issuers');
    if (showAllAvg) _u.searchParams.set('allAvg', '1'); else _u.searchParams.delete('allAvg');
    history.replaceState({}, '', _u);
  } catch (_e) {}
}

// Restore from URL > localStorage > defaults, before first render.
(function _restoreLeaseState() {
  const _params = new URLSearchParams(window.location.search);
  let _saved = {};
  try { _saved = JSON.parse(localStorage.getItem('ccm_lease_state') || '{}') || {}; } catch (_e) {}
  const _pick = (k) => _params.has(k) ? _params.get(k) : _saved[k];

  const _dq = _pick('dq');
  if (_dq) {
    const _opt = Array.from(dqSel.options).find(o => o.value === _dq);
    if (_opt) { dqSel.value = _dq; dqFilter = _dq; }
  }

  const _mode = _pick('mode');
  if (_mode === 'timeseries' || _mode === 'vintage') {
    mode = _mode;
    document.body.dataset.sub = (mode === 'vintage') ? 'vintage' : 'timeseries';
    [...subViewGrp.children].forEach(b => b.classList.toggle('active', b.dataset.subview === mode));
  }

  const _issuer = _pick('issuer');
  if (_issuer && dataByIssuer[_issuer]) {
    selectedIssuer = _issuer;
    issuerSel.value = _issuer;
  }

  let _issuers = null;
  if (_params.has('issuers')) _issuers = _params.get('issuers').split(',').filter(Boolean);
  else if (Array.isArray(_saved.issuers)) _issuers = _saved.issuers;
  if (_issuers) {
    selectedIssuers.clear();
    issuerPanel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      if (cb.value === '__all__') return;
      const want = _issuers.includes(cb.value);
      cb.checked = want;
      if (want) selectedIssuers.add(cb.value);
    });
  }

  const _allAvg = _params.has('allAvg') ? _params.get('allAvg') === '1' : _saved.allAvg;
  if (_allAvg) {
    showAllAvg = true;
    const _cb = issuerPanel.querySelector('input[value="__all__"]');
    if (_cb) _cb.checked = true;
  }

  updateIssuerBtnText();
})();

dqSel.addEventListener('change', () => { dqFilter = dqSel.value; _saveLeaseState(); render(); });

function dqRate(g, total) {
  if (total < 10) return null;
  if (dqFilter === '60+')    return g.d60 / total;
  if (dqFilter === '30-59')  return g.d3059 / total;
  if (dqFilter === 'any-dq') return (g.d3059 + g.d60) / total;
  return null;
}

const _MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateLabel(s) {
  if (!s || s.length < 7) return s;
  return _MO[parseInt(s.substring(5, 7), 10) - 1] + ' ' + s.substring(0, 4);
}
function toMonthStart(s) { return s ? s.substring(0, 7) + '-01' : s; }
function shortSeries(s) {
  const m = (s || '').match(/\d{4}-\s*[A-Za-z0-9]+/);
  return m ? m[0].replace(/\s/g, '') : s;
}

function dataAnchorDate() {
  let maxD = '';
  for (const r of SERIES_DATA) if (r.reporting_date > maxD) maxD = r.reporting_date;
  return maxD;
}
function rangeCutoff(rangeKey) {
  if (rangeKey === 'all') return null;
  const months = { '5y': 60, '3y': 36, '2y': 24, '1y': 12 }[rangeKey];
  if (!months) return null;
  const maxD = dataAnchorDate();
  if (!maxD) return null;
  const [y, m, d] = maxD.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCMonth(dt.getUTCMonth() - months);
  return dt.toISOString().substring(0, 10);
}

function aggregateVintage() {
  const rows = dataByIssuer[selectedIssuer] || [];
  const cutoff = rangeCutoff(vintageRange.value);
  const filtered = cutoff ? rows.filter(r => r.reporting_date >= cutoff) : rows;
  return filtered.map(r => {
    const total = (r.count_current || 0) + (r.count_30_59 || 0) + (r.count_60_plus || 0);
    const rate = dqRate({ d3059: r.count_30_59 || 0, d60: r.count_60_plus || 0 }, total);
    if (rate === null) return null;
    return {
      series: shortSeries(r.series),
      reporting_date: r.reporting_date,
      date_label: fmtDateLabel(r.reporting_date),
      vintage_month: r.vintage_month,
      lease_count: total,
      dq_rate: rate,
    };
  }).filter(Boolean);
}

function aggregateTimeSeries() {
  const cutoff = rangeCutoff(tsRange.value);
  // Group by (code, month) across the union of (selected ∪ all-avg input)
  const inputCodes = new Set(selectedIssuers);
  if (showAllAvg) for (const c of issuerCodes) inputCodes.add(c);
  const grouped = new Map();  // key = code||month
  for (const code of inputCodes) {
    const rows = dataByIssuer[code] || [];
    for (const r of rows) {
      if (cutoff && r.reporting_date < cutoff) continue;
      const month = toMonthStart(r.reporting_date);
      const key = code + '||' + month;
      if (!grouped.has(key)) grouped.set(key, { code, month, cur: 0, d3059: 0, d60: 0 });
      const g = grouped.get(key);
      g.cur   += r.count_current  || 0;
      g.d3059 += r.count_30_59    || 0;
      g.d60   += r.count_60_plus  || 0;
    }
  }

  const result = [];

  // Per-issuer lines (only for explicitly selected issuers)
  for (const g of grouped.values()) {
    if (!selectedIssuers.has(g.code)) continue;
    const total = g.cur + g.d3059 + g.d60;
    const rate = dqRate(g, total);
    if (rate === null) continue;
    result.push({
      series: ISSUER_LABELS[g.code] || g.code,
      reporting_date: g.month,
      date_label: fmtDateLabel(g.month),
      lease_count: total,
      dq_rate: rate,
    });
  }

  // All-issuers weighted average: sum across every issuer's per-month groups,
  // then compute the rate from the aggregate. Lease-count weighted.
  if (showAllAvg) {
    const byMonth = new Map();
    for (const g of grouped.values()) {
      if (!byMonth.has(g.month)) byMonth.set(g.month, { cur: 0, d3059: 0, d60: 0 });
      const agg = byMonth.get(g.month);
      agg.cur   += g.cur;
      agg.d3059 += g.d3059;
      agg.d60   += g.d60;
    }
    for (const [month, agg] of byMonth) {
      const total = agg.cur + agg.d3059 + agg.d60;
      const rate = dqRate(agg, total);
      if (rate === null) continue;
      result.push({
        series: 'All Issuers',
        reporting_date: month,
        date_label: fmtDateLabel(month),
        lease_count: total,
        dq_rate: rate,
      });
    }
  }

  return result;
}

function buildSpec(data) {
  const isVintage = mode === 'vintage';
  const yLabel = { '60+': '60+ DPD Rate', '30-59': '30–59 DPD Rate', 'any-dq': '30+ DPD Rate' }[dqFilter];
  const xEnc = isVintage
    ? { field: 'vintage_month', type: 'quantitative', title: 'Months Since Issuance', axis: { tickMinStep: 1 } }
    : { field: 'reporting_date', type: 'temporal', timeUnit: 'utcyearmonth', title: 'Reporting Date',
        axis: { tickCount: { utcyear: 1 }, format: '%Y', labelAngle: 0, labelOverlap: false } };
  return {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "autosize": { "type": "fit", "contains": "padding" },
    "config": {
      "axis":  { "labelFontSize": 13, "titleFontSize": 14 },
      "title": { "anchor": "middle", "fontSize": 15, "subtitleFontSize": 11 },
      "view":  { "continuousHeight": 300, "continuousWidth": 300 },
    },
    "data":   { "values": data },
    "width":  "container",
    "height": "container",
    "layer": [
      {
        "params": [{
          "name": "Series", "bind": "legend",
          "select": { "type": "point", "fields": ["series"], "toggle": true, "clear": false },
        }],
        "mark": { "type": "line", "interpolate": "monotone", "tension": 0.7 },
        "encoding": {
          "x": xEnc,
          "y": { "field": "dq_rate", "type": "quantitative", "title": yLabel, "axis": { "format": ".2%" } },
          "color": {
            "field": "series", "type": "nominal", "title": "Series",
            "legend": {
              "orient": "bottom", "direction": "horizontal",
              "columns": 8, "labelLimit": 90, "symbolSize": 110, "symbolLimit": 1000,
            },
          },
          "opacity": { "condition": { "param": "Series", "empty": true, "value": 1 }, "value": 0.25 },
          "size": {
            "condition": [
              { "test": "datum.series === 'All Issuers'", "value": 4.0 },
              { "param": "Series", "empty": false, "value": 3.0 }
            ],
            "value": 1.8
          },
          "tooltip": [
            { "field": "series", "type": "nominal", "title": "Series" },
            { "field": "date_label", "type": "nominal", "title": "Date" },
            { "field": "dq_rate", "type": "quantitative", "title": yLabel, "format": ".2%" },
            { "field": "lease_count", "type": "quantitative", "title": "Active leases", "format": "," },
          ],
        },
      },
    ],
  };
}

function render() {
  const isVintage = mode === 'vintage';
  const data = isVintage ? aggregateVintage() : aggregateTimeSeries();

  if (isVintage) {
    const lbl = (ISSUER_LABELS[selectedIssuer] || selectedIssuer || '');
    viewTitle.textContent = lbl + ' — Delinquency by Seasoning';
    viewSubtitle.textContent = 'Each line = one deal series · click legend to highlight';
  } else {
    viewTitle.textContent = 'Cross-Issuer Delinquency Trends';
    const parts = [];
    const n = selectedIssuers.size;
    if (n) parts.push(n + ' issuer' + (n === 1 ? '' : 's') + ' selected');
    if (showAllAvg) parts.push('All Issuers weighted avg');
    viewSubtitle.textContent = (parts.join(' · ') || 'Pick one or more issuers') + ' · click legend to highlight';
  }

  if (!data.length) {
    visEl.innerHTML = '<div class="loading">No data for current filter selection.</div>';
    return;
  }

  vegaEmbed('#vis', buildSpec(data), { actions: false }).catch(err => {
    visEl.innerHTML = '<div class="err loading">Chart error: ' + err.message + '</div>';
  });
}

render();
</script>

<script>
// ── iframe-resizer content side ───────────────────────────────────
// Post our content height to the parent shell (Squarespace) so it can
// grow the iframe to match. Without this, the iframe stays at a small
// default height, content overflows, and iOS Safari rubber-bands at the
// bottom of the chart. Mirrors generate_sec_explorer_data.py.
(function() {
  function postHeight() {
    var h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    try { window.parent.postMessage({type:'cm-iframe-height', height:h}, '*'); } catch (e) {}
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(postHeight).observe(document.body);
  }
  window.addEventListener('resize', postHeight);
  postHeight();
  setTimeout(postHeight, 300);
  setTimeout(postHeight, 1500);
})();
</script>
</body>
