<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economic Data Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: Georgia, serif; background: #fff; color: #2c3e50; font-size: 14px; }

    /* ── Header ── */
    #header {
      padding: 12px 18px 8px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    #header h1 { font-size: 18px; font-weight: normal; }
    #updated { font-size: 11px; color: #999; }

    /* ── Category tabs ── */
    #category-tabs {
      display: flex;
      gap: 0;
      padding: 0 18px;
      border-bottom: 2px solid #e8e8e8;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      padding: 8px 16px;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      background: none;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .cat-tab:hover { color: #2c3e50; }
    .cat-tab.active { color: #2E86AB; border-bottom-color: #2E86AB; font-weight: bold; }

    /* ── Main layout ── */
    #main {
      display: flex;
      height: calc(100vh - 90px);
      min-height: 440px;
      overflow: hidden;
    }

    /* ── Series panel ── */
    #series-panel {
      width: 185px;
      min-width: 150px;
      border-right: 1px solid #e8e8e8;
      overflow-y: auto;
      padding: 10px 10px 16px;
      flex-shrink: 0;
    }
    .toggle-row {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .toggle-row button {
      flex: 1;
      font-size: 11px;
      padding: 3px 0;
      border: 1px solid #ddd;
      border-radius: 3px;
      background: #fafafa;
      cursor: pointer;
      font-family: Georgia, serif;
      color: #555;
    }
    .toggle-row button:hover { background: #f0f0f0; }
    .series-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin-bottom: 7px;
    }
    .series-item input[type="checkbox"] {
      margin-top: 3px;
      cursor: pointer;
      accent-color: #2E86AB;
      flex-shrink: 0;
    }
    .series-item label {
      font-size: 12.5px;
      color: #333;
      cursor: pointer;
      line-height: 1.35;
    }

    /* ── Chart panel ── */
    #chart-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Controls bar ── */
    #controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px 6px;
      border-bottom: 1px solid #f0f0f0;
      flex-wrap: wrap;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .ctrl-label {
      font-size: 11px;
      color: #999;
      margin-right: 2px;
    }
    .preset-btn {
      padding: 4px 11px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 12px;
      color: #444;
      transition: background 0.1s;
    }
    .preset-btn:hover { background: #f5f5f5; }
    .preset-btn.active { background: #2E86AB; color: #fff; border-color: #2E86AB; }
    .bar-btn {
      padding: 4px 11px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 12px;
      color: #444;
      transition: background 0.1s;
    }
    .bar-btn:hover { background: #f5f5f5; }
    .bar-btn.active { background: #2E86AB; color: #fff; border-color: #2E86AB; }

    select {
      font-family: Georgia, serif;
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      color: #444;
      background: #fff;
      cursor: pointer;
    }
    #custom-date-group { display: none; align-items: center; gap: 5px; }
    #custom-date-group input[type="date"] {
      font-size: 12px;
      padding: 3px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: Georgia, serif;
    }


    /* ── Chart title ── */
    #chart-title {
      font-size: 15px;
      font-weight: 600;
      color: #2c3e50;
      text-align: center;
      padding: 6px 10px 4px;
      min-height: 24px;
    }

    /* ── Vis container ── */
    #vis-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 6px 10px 0;
    }
    #vis { width: 100%; }
    #vis .vega-embed { width: 100% !important; }

    /* ── Source footnote (inside vis-container, sits right below chart) ── */
    #chart-source {
      font-size: 11px;
      color: #999;
      padding: 2px 0 4px;
    }

    #no-series-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #bbb;
      font-size: 13px;
      text-align: center;
    }

    /* ── Table section ── */
    #table-footer {
      border-top: 1px solid #f0f0f0;
      padding: 4px 16px 0;
    }
    #table-toggle-btn {
      background: none;
      border: none;
      color: #2E86AB;
      font-size: 12px;
      cursor: pointer;
      font-family: Georgia, serif;
      padding: 4px 0;
    }

    #data-table-wrap {
      display: none;
      overflow-x: auto;
      max-height: 180px;
      overflow-y: auto;
      padding-bottom: 8px;
    }
    #data-table-wrap table {
      border-collapse: collapse;
      font-size: 12px;
      width: 100%;
    }
    #data-table-wrap th {
      background: #f5f5f5;
      padding: 4px 9px;
      text-align: left;
      border: 1px solid #e0e0e0;
      font-weight: normal;
      color: #555;
      white-space: nowrap;
    }
    #data-table-wrap td {
      padding: 3px 9px;
      border: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    /* ── Chip strip ── */
    #chip-strip {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px 18px 5px;
      background: #f8f9fa;
      border-bottom: 1px solid #e8e8e8;
      font-size: 12px;
    }
    .chip-label { color: #999; margin-right: 2px; flex-shrink: 0; }
    .chip {
      display: inline-flex;
      align-items: center;
      background: #e8f4fb;
      border: 1px solid #b8d9ee;
      border-radius: 12px;
      padding: 2px 6px 2px 9px;
      font-size: 12px;
      color: #2c5f7a;
      gap: 3px;
      white-space: nowrap;
    }
    .chip-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #7ab0cc;
      font-size: 14px;
      padding: 0 1px;
      line-height: 1;
      font-family: Georgia, serif;
    }
    .chip-remove:hover { color: #2E86AB; }
    #clear-chips-btn {
      margin-left: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 11px;
      font-family: Georgia, serif;
      text-decoration: underline;
      padding: 0;
    }
    #clear-chips-btn:hover { color: #666; }

    /* ── Chip axis buttons ── */
    .chip-axis { display: flex; gap: 1px; margin-left: 4px; }
    .chip-axis-btn {
      background: none;
      border: 1px solid #b8d9ee;
      border-radius: 3px;
      cursor: pointer;
      color: #7ab0cc;
      font-size: 10px;
      padding: 0 4px;
      line-height: 1.6;
      font-family: Georgia, serif;
    }
    .chip-axis-btn.active { background: #2E86AB; color: #fff; border-color: #2E86AB; }

    /* ── Chip mark buttons ── */
    .chip-mark { display: flex; gap: 1px; margin-left: 4px; }
    .chip-mark-btn {
      background: none;
      border: 1px solid #b8d9ee;
      border-radius: 3px;
      cursor: pointer;
      color: #7ab0cc;
      font-size: 10px;
      padding: 0 4px;
      line-height: 1.6;
      font-family: Georgia, serif;
    }
    .chip-mark-btn.active { background: #2E86AB; color: #fff; border-color: #2E86AB; }
    .chip-plus-btn {
      background: none;
      border: 1px solid #b8d9ee;
      border-radius: 3px;
      cursor: pointer;
      color: #7ab0cc;
      font-size: 12px;
      padding: 0 5px;
      line-height: 1.6;
      font-family: Georgia, serif;
      margin-left: 2px;
    }
    .chip-plus-btn:hover { color: #2E86AB; border-color: #2E86AB; }

    /* ── Secondary layer chip ── */
    .secondary-chip {
      display: inline-flex;
      align-items: center;
      background: #f0f8ff;
      border: 1px solid #cce4f7;
      border-radius: 12px;
      padding: 2px 6px 2px 9px;
      font-size: 11px;
      color: #3a6b82;
      gap: 3px;
      white-space: nowrap;
    }
    .secondary-chip-select {
      font-family: Georgia, serif;
      font-size: 11px;
      padding: 1px 4px;
      border: 1px solid #cce4f7;
      border-radius: 3px;
      color: #3a6b82;
      background: #f0f8ff;
      cursor: pointer;
    }
  </style>
</head>

<div id="app">
  <div id="header">
    <h1>Economic Data Dashboard</h1>
    <span id="updated">Updated: March 25, 2026</span>
  </div>

  <div id="category-tabs"></div>

  <div id="chip-strip">
    <span class="chip-label">In chart:</span>
    <div id="chips"></div>
    <button id="clear-chips-btn">Clear all</button>
  </div>

  <div id="main">
    <div id="series-panel">
      <div class="toggle-row">
        <button id="btn-all">All</button>
        <button id="btn-none">None</button>

      <div id="series-list"></div>
    </div>

    <div id="chart-panel">
      <div id="controls">
        <div class="ctrl-group">
          <span class="ctrl-label">Range:</span>
          <button class="preset-btn active" data-months="all">All</button>

          <button class="preset-btn" data-months="60">5Y</button>
          <button class="preset-btn" data-months="12">1Y</button>
          <button class="preset-btn" data-months="custom">Custom</button>
        </div>
        <div class="ctrl-group" id="custom-date-group">
          <input type="date" id="date-start">
          <span style="color:#ccc;font-size:11px">—</span>
          <input type="date" id="date-end">
        </div>
        <div class="ctrl-group" id="transform-group">
          <span class="ctrl-label">Transform:</span>
          <select id="transform-select"></select>
        </div>

        <div class="ctrl-group" id="barlayout-group" style="display:none">
          <span class="ctrl-label">Bars:</span>
          <button class="bar-btn active" data-layout="grouped">Grouped</button>
          <button class="bar-btn" data-layout="stacked">Stacked</button>
        </div>
      </div>

      <div id="chart-title"></div>

      <div id="vis-container">
        <div id="vis"></div>
        <div id="no-series-msg">Select one or more series from the panel</div>
        <div id="chart-source"></div>
      </div>

      <div id="table-footer">

        <button id="table-toggle-btn">&#9660; Show data table</button>
        <div id="data-table-wrap">
          <table id="data-table"></table>
        </div>
      </div>
    </div>
  </div>
</div>

// Build category → [series_id] map
// ─────────────────────────────────────────────────────────────────────────────
function buildCategoryMap() {
  const cats = {};
  for (const [sid, s] of Object.entries(DASHBOARD_DATA.series)) {
    const cat = s.category || "Other";
    if (!cats[cat]) cats[cat] = [];
    cats[cat].push(sid);
  }
  if (Object.keys(DASHBOARD_DATA.nyfed).length > 0) {
    cats["NY Fed"] = Object.keys(DASHBOARD_DATA.nyfed);
  }
  return cats;
}

const CAT_MAP = buildCategoryMap();

// Sort categories: known order first, then alpha, NY Fed last
const ALL_CATS = (() => {
  const known = FRED_CAT_ORDER.filter(c => CAT_MAP[c]);
  const rest = Object.keys(CAT_MAP)
    .filter(c => !FRED_CAT_ORDER.includes(c) && c !== "NY Fed")
    .sort();
  const nyfed = CAT_MAP["NY Fed"] ? ["NY Fed"] : [];
  return [...known, ...rest, ...nyfed];
})();

// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────
function init() {
  // Pre-select default series as bars on left axis
  const _defaults = ["STDSAUTO", "DRTSCLCC"];
  for (const sid of _defaults) {
    if (DASHBOARD_DATA.series[sid]) {
      state.selected.add(sid);
      state.markAssignment.set(sid, "bar");
      state.axisAssignment.set(sid, "left");
    }
  }

  buildCategoryTabs();
  activateCategory("Auto Market");

  document.getElementById("btn-all").addEventListener("click", selectAll);
  document.getElementById("btn-none").addEventListener("click", selectNone);

  document.getElementById("clear-chips-btn").addEventListener("click", () => {
    state.selected.clear();
    state.axisAssignment.clear();
    state.markAssignment.clear();
    state.secondaryLayers.clear();
    document.querySelectorAll(".series-cb").forEach(cb => { cb.checked = false; });
    state.normalize = false;
    state.barLayout = "grouped";
    document.querySelectorAll(".bar-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.layout === "grouped"));
    updateTransformOptions();
    renderChips();
    updateChart();
  });

  // Scope to only date-range buttons (data-months attribute) so bar-btn clicks don't interfere
  document.querySelectorAll(".preset-btn[data-months]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".preset-btn[data-months]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.dateRange = btn.dataset.months;
      const isCustom = state.dateRange === "custom";
      document.getElementById("custom-date-group").style.display = isCustom ? "flex" : "none";
      if (!isCustom) updateChart();
    });
  });

  document.querySelectorAll(".bar-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.barLayout = btn.dataset.layout;
      document.querySelectorAll(".bar-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.layout === state.barLayout));
      updateChart();
    });
  });

  document.getElementById("date-start").addEventListener("change", e => {
    state.customStart = e.target.value || null;
    updateChart();
  });
  document.getElementById("date-end").addEventListener("change", e => {
    state.customEnd = e.target.value || null;
    updateChart();
  });

  document.getElementById("transform-select").addEventListener("change", e => {
    state.transform = e.target.value;
    renderChips();  // refresh secondary chip transform selects
    updateChart();
  });


  document.getElementById("table-toggle-btn").addEventListener("click", () => {
    state.tableVisible = !state.tableVisible;
    document.getElementById("data-table-wrap").style.display =
      state.tableVisible ? "block" : "none";
    document.getElementById("table-toggle-btn").textContent =
      state.tableVisible ? "\u25B2 Hide data table" : "\u25BC Show data table";
    if (state.tableVisible) renderTable();
  });

  window.addEventListener("resize", () => { if (_currentView) updateChart(); });
}

// ─────────────────────────────────────────────────────────────────────────────
// Category tabs
// ─────────────────────────────────────────────────────────────────────────────
function buildCategoryTabs() {
  const container = document.getElementById("category-tabs");
  container.innerHTML = "";
  for (const cat of ALL_CATS) {
    const btn = document.createElement("button");
    btn.className = "cat-tab";
    btn.textContent = cat;
    btn.dataset.cat = cat;
    btn.addEventListener("click", () => activateCategory(cat));
    container.appendChild(btn);
  }
}

function activateCategory(cat) {
  const crossingBoundary =
    (state.category === "NY Fed") !== (cat === "NY Fed");

  state.category = cat;

  // Clear selection only when crossing between NY Fed and FRED (incompatible data)
  if (crossingBoundary) {
    state.selected.clear();
    state.axisAssignment.clear();
    state.markAssignment.clear();
    state.secondaryLayers.clear();
    state.normalize = false;
  }

  document.querySelectorAll(".cat-tab").forEach(b => {
    b.classList.toggle("active", b.dataset.cat === cat);
  });

  buildSeriesList(cat);

  // Pre-select first series only when nothing is currently selected
  if (state.selected.size === 0) {
    const ids = CAT_MAP[cat] || [];
    if (ids.length > 0) {
      state.selected.add(ids[0]);
      const cb = document.querySelector('.series-cb[data-id="' + ids[0] + '"]');
      if (cb) cb.checked = true;
    }
  }

  const isNYFed = cat === "NY Fed";
  document.getElementById("transform-group").style.display = isNYFed ? "none" : "flex";

  updateTransformOptions();
  renderChips();
  updateChart();
}

// ─────────────────────────────────────────────────────────────────────────────
// Series list
// ─────────────────────────────────────────────────────────────────────────────
function buildSeriesList(cat) {
  const container = document.getElementById("series-list");
  container.innerHTML = "";
  const ids = CAT_MAP[cat] || [];
  const isNYFed = cat === "NY Fed";

  for (const sid of ids) {
    const info = isNYFed
      ? DASHBOARD_DATA.nyfed[sid]
      : DASHBOARD_DATA.series[sid];
    if (!info) continue;

    const item = document.createElement("div");
    item.className = "series-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "series-cb";
    cb.dataset.id = sid;
    cb.checked = state.selected.has(sid);
    cb.addEventListener("change", () => {
      if (cb.checked) state.selected.add(sid);
      else {
        state.selected.delete(sid);
        state.axisAssignment.delete(sid);
        state.markAssignment.delete(sid);
        state.secondaryLayers.delete(sid);
      }
      updateTransformOptions();
      renderChips();
      updateChart();
    });

    const lbl = document.createElement("label");
    lbl.textContent = info.short_label || info.title || sid;
    lbl.title = info.title || sid;
    lbl.addEventListener("click", () => cb.click());

    item.appendChild(cb);
    item.appendChild(lbl);
    container.appendChild(item);
  }
}

function selectAll() {
  const ids = CAT_MAP[state.category] || [];
  for (const sid of ids) state.selected.add(sid);
  document.querySelectorAll(".series-cb").forEach(cb => { cb.checked = true; });
  updateTransformOptions();
  renderChips();
  updateChart();
}

function selectNone() {
  const ids = new Set(CAT_MAP[state.category] || []);
  for (const sid of ids) {
    state.selected.delete(sid);
    state.axisAssignment.delete(sid);
    state.markAssignment.delete(sid);
    state.secondaryLayers.delete(sid);
  }
  document.querySelectorAll(".series-cb").forEach(cb => { cb.checked = false; });
  updateTransformOptions();
  renderChips();
  updateChart();
}

// ─────────────────────────────────────────────────────────────────────────────
// Transform options (intersection across selected series)
// ─────────────────────────────────────────────────────────────────────────────
function getAvailableTransforms() {
  // NY Fed series have no transforms
  for (const sid of state.selected) {
    if (DASHBOARD_DATA.nyfed[sid]) return ["lin"];
  }
  let common = null;
  for (const sid of state.selected) {
    const s = DASHBOARD_DATA.series[sid];
    if (!s) continue;
    const ts = new Set(Object.keys(s.transforms));
    common = common === null ? ts : new Set([...common].filter(t => ts.has(t)));
  }
  if (!common || common.size === 0) return ["lin"];
  return TRANSFORM_ORDER.filter(t => common.has(t));
}

function updateTransformOptions() {
  const select = document.getElementById("transform-select");
  const available = getAvailableTransforms();
  const current = state.transform;

  select.innerHTML = "";
  for (const t of available) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = TRANSFORM_LABELS[t] || t;
    if (t === current) opt.selected = true;
    select.appendChild(opt);
  }

  if (!available.includes(current)) {
    state.transform = available[0] || "lin";
    select.value = state.transform;
  }

  const showMulti = state.selected.size > 1 && state.category !== "NY Fed";

  // Show Grouped/Stacked toggle only when 2+ bar-mark series share the same axis
  const leftBarCount  = [...state.selected].filter(s =>
    (state.markAssignment.get(s) || "line") === "bar" &&
    (state.axisAssignment.get(s) || "left") === "left").length;
  const rightBarCount = [...state.selected].filter(s =>
    (state.markAssignment.get(s) || "line") === "bar" &&
     state.axisAssignment.get(s) === "right").length;
  const showBarLayout = leftBarCount > 1 || rightBarCount > 1;
  document.getElementById("barlayout-group").style.display = showBarLayout ? "flex" : "none";
  if (!showBarLayout) {
    state.barLayout = "grouped";
    document.querySelectorAll(".bar-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.layout === "grouped"));
  }

}

// ─────────────────────────────────────────────────────────────────────────────
// Data assembly
// ─────────────────────────────────────────────────────────────────────────────
function getRowsForLayer(layer) {
  const nyfed = DASHBOARD_DATA.nyfed[layer.sid];
  if (nyfed) return nyfed.data.map(([d, v]) => ({ date: d, value: v }));
  const s = DASHBOARD_DATA.series[layer.sid];
  if (!s) return [];
  const raw = s.transforms[layer.transform] || s.transforms["lin"] || [];
  return raw.map(([d, v]) => ({ date: d, value: v }));
}

// Build the full ordered list of layers to render (primary + optional secondary per series)
function buildLayerArray() {
  const layers = [];
  for (const sid of state.selected) {
    const info = DASHBOARD_DATA.nyfed[sid] || DASHBOARD_DATA.series[sid];
    if (!info) continue;
    const mark = state.markAssignment.get(sid) || "line";
    const axis = state.axisAssignment.get(sid) || "left";
    const shortName = info.short_label || info.title || sid;
    layers.push({ sid, title: shortName, fullTitle: info.title || sid, transform: state.transform, mark, axis, secondary: false });
    const sec = state.secondaryLayers.get(sid);
    if (sec) {
      const secLabel = TRANSFORM_LABELS[sec.transform] || sec.transform;
      layers.push({
        sid,
        title: shortName + " — " + secLabel,
        fullTitle: (info.title || sid) + " — " + secLabel,
        transform: sec.transform,
        mark: sec.mark || "bar",
        axis: sec.axis || "right",
        secondary: true,
      });
    }
  }
  return layers;
}

function filterByRange(rows) {
  const range = state.dateRange;
  if (range === "all") return rows;
  if (range === "custom") {
    return rows.filter(r =>
      (!state.customStart || r.date >= state.customStart) &&
      (!state.customEnd   || r.date <= state.customEnd)
    );
  }
  const months = parseInt(range, 10);
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - months);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  return rows.filter(r => r.date >= cutoffStr);
}

function applyNormalize(datasets) {
  if (!state.normalize) return datasets;
  return datasets.map(ds => {
    if (ds.data.length === 0) return ds;
    const base = ds.data[0].value;
    if (!base || base === 0) return ds;
    return {
      ...ds,
      data: ds.data.map(r => ({ ...r, value: Math.round((r.value / base) * 10000) / 100 }))
    };
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Vega-Lite spec builder
// ─────────────────────────────────────────────────────────────────────────────
// Tableau10 palette — used explicitly so both axes share the same colour mapping
const TABLEAU10 = [
  "#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f",
  "#edc948","#b07aa1","#ff9da7","#9c755f","#bab0ac"
];

// Returns a Y-axis label appropriate for a single layer's transform + series type
function _yLabelForLayer(layer) {
  if (DASHBOARD_DATA.nyfed[layer.sid]) return "Percent (%)";
  const s = DASHBOARD_DATA.series[layer.sid];
  if (!s) return "Value";
  const lbl = s.label || s.value_label || "Value";
  return lbl.includes("SLOOS") ? lbl + ", %" : lbl;
}

// Human-readable transform labels for the footnote
const TRANSFORM_NOTE_LABELS = {
  pc1: "Year-over-Year % Change",
  pch: "Month-over-Month % Change",
  chg: "Change from Prior Period",
  ch1: "Change from Year Ago",
  pca: "Annualized % Rate",
  log: "Natural Log",
};

function buildSpec(datasets) {
  // datasets: [{sid, title, transform, mark, axis, secondary, data: [{date, value}]}]
  const isMulti = datasets.length > 1;

  // Stable colour scale across all datasets so both axes share consistent colours
  const allTitles = datasets.map(d => d.title);
  const allColors = allTitles.map((_, i) => TABLEAU10[i % TABLEAU10.length]);
  const colorScale = { domain: allTitles, range: allColors };
  const colorEnc = (showLegend) => ({
    field: "series", type: "nominal",
    scale: colorScale,
    legend: showLegend
      ? { title: null, orient: "top", labelFont: "Georgia, serif", labelFontSize: 12 }
      : null
  });

  const leftDs  = datasets.filter(d => (d.axis || "left") === "left");
  const rightDs = datasets.filter(d => d.axis === "right");
  const hasDual = leftDs.length > 0 && rightDs.length > 0;

  function toRows(ds) {
    const rows = [];
    for (const d of ds)
      for (const { date, value } of d.data)
        rows.push({ date, value, series: d.title });
    return rows;
  }

  const allRows = toRows(datasets);
  const leftLabel  = leftDs.length  === 1 ? _yLabelForLayer(leftDs[0])  : null;
  const rightLabel = rightDs.length === 1 ? _yLabelForLayer(rightDs[0]) : null;

  // Use SI-prefix compact notation ("~s": 1600000 → "1.6M") for levels data;
  // keep decimal format for percentage/change transforms to avoid "500m" for 0.5.
  const PCT_TRANSFORMS = new Set(["pc1", "pch", "pca", "ch1", "chg"]);
  function _axisFormat(layer) {
    if (DASHBOARD_DATA.nyfed[layer.sid]) return ".2f";
    return PCT_TRANSFORMS.has(layer.transform) ? ".2~f" : "~s";
  }
  const leftFormat  = leftDs.length  ? _axisFormat(leftDs[0])  : "~s";
  const rightFormat = rightDs.length ? _axisFormat(rightDs[0]) : "~s";

  const _txLabel = TRANSFORM_NOTE_LABELS[state.transform];

  // ── X-scale: symmetric domain buffer ────────────────────────────────────────
  // Vega-Lite's nice:true snaps to year boundaries → asymmetric margins.
  // explicit domainMin/Max + nice:false keeps both sides equal.
  // Buffer must also cover grouped-bar date shift + half bar-width; the math
  // works out to medGap × 0.4 regardless of series count, so we use × 0.45.
  const _allMs = datasets.flatMap(d => d.data.map(r => new Date(r.date).getTime()))
                         .filter(t => isFinite(t));

  // Median inter-point gap across ALL datasets (proxy for data frequency)
  let _medGap = 30 * 86400000;  // default: monthly
  {
    const _gaps = [];
    for (const d of datasets) {
      const ts = d.data.map(r => new Date(r.date).getTime()).sort((a, b) => a - b);
      for (let i = 1; i < ts.length; i++) _gaps.push(ts[i] - ts[i - 1]);
    }
    if (_gaps.length) {
      _gaps.sort((a, b) => a - b);
      _medGap = _gaps[Math.floor(_gaps.length / 2)];
    }
  }

  let _xScale = {};
  if (_allMs.length) {
    const _lo  = _allMs.reduce((a, b) => Math.min(a, b),  Infinity);
    const _hi  = _allMs.reduce((a, b) => Math.max(a, b), -Infinity);
    const _buf = Math.max((_hi - _lo) * 0.025, _medGap * 0.45);
    _xScale = {
      domainMin: new Date(_lo - _buf).toISOString().slice(0, 10),
      domainMax: new Date(_hi + _buf).toISOString().slice(0, 10),
      nice: false
    };
  }

  // ── X-axis: smart tick granularity ──────────────────────────────────────────
  // Choose tick interval and label format based on the viewed date span and
  // the underlying data frequency (monthly / quarterly / annual).
  const _medGapDays  = _medGap / 86400000;
  const _isQtrly     = _medGapDays >= 75;   // quarterly or sparser
  const _isAnnual    = _medGapDays >= 300;  // annual

  // Span in months: prefer the state preset; fall back to actual data range.
  const _spanMonths = (state.dateRange === "all" || state.dateRange === "custom")
    ? (_allMs.length
        ? (_allMs.reduce((a,b) => Math.max(a,b), -Infinity) -
           _allMs.reduce((a,b) => Math.min(a,b),  Infinity)) / (30.44 * 86400000)
        : 120)
    : parseInt(state.dateRange) || 120;

  // Use numeric tickCount for short/medium ranges (universally supported) and
  // the "year" string for long ranges.  Object form {interval,step} is avoided
  // as some Vega-Lite v5 patch versions silently reject it.
  // NOTE: variables named _xTicks/_xFmt to avoid shadowing _axisFormat() above.
  let _xTicks, _xFmt;
  if (_spanMonths <= 18) {
    // ≤ ~1.5 years: monthly ticks (labelOverlap drops crowded ones naturally)
    _xTicks = "month";
    _xFmt   = "%b %Y";
  } else if (_spanMonths <= 48) {
    // ~2–4 years: semi-annual ticks (~4–8 labels)
    _xTicks = Math.round(_spanMonths / 6);
    _xFmt   = "%b %Y";
  } else if (_spanMonths <= 96) {
    // ~5–8 years: annual for coarse data, semi-annual for monthly data
    _xTicks = (_isQtrly || _isAnnual) ? "year" : Math.round(_spanMonths / 6);
    _xFmt   = (_isQtrly || _isAnnual) ? "%Y"   : "%b %Y";
  } else {
    // 8+ years: annual only
    _xTicks = "year";
    _xFmt   = "%Y";
  }

  const xEnc = {
    field: "date", type: "temporal",
    title: _txLabel ? "Transform: " + _txLabel : null,
    scale: _xScale,
    axis: { format: _xFmt, labelColor: "#666", labelFontSize: 11,
            grid: false, domain: false, labelOverlap: true, tickCount: _xTicks,
            titleColor: "#aaa", titleFontSize: 11, titleFont: "Georgia, serif",
            titlePadding: 14 }
  };

  function yEnc(label, isRight) {
    const fmt = isRight ? rightFormat : leftFormat;
    return {
      field: "value", type: "quantitative",
      axis: { title: label, titleFontSize: 11, titleColor: "#555", titleFont: "Georgia, serif",
              titleAngle: -90, titleAlign: "center", titlePadding: 8,
              labelColor: "#666", labelFontSize: 11, format: fmt,
              ...(isRight ? { orient: "right" } : {}) }
    };
  }

  // Track which axis sides have already declared their axis spec.
  // First layer per side gets the full axis object; subsequent layers omit
  // the axis key entirely (NOT null) so Vega-Lite shares the declared axis
  // without suppressing or duplicating it.
  const axisUsed = { left: false, right: false };
  function takeAxis(label, isRight) {
    const side = isRight ? "right" : "left";
    if (axisUsed[side]) return { field: "value", type: "quantitative" };
    axisUsed[side] = true;
    return yEnc(label, isRight);
  }

  // Show legend on the first layer rendered; subsequent layers suppress it.
  // The shared colorScale domain includes all series so all appear in the legend
  // regardless of which layer declares it.
  let legendShown = false;
  function colorEncOnce() {
    if (!legendShown && isMulti) { legendShown = true; return colorEnc(true); }
    return colorEnc(false);
  }

  const layers = [];

  // Area shading — only for a single dataset rendered as a line on left axis
  if (datasets.length === 1 && datasets[0].mark === "line") {
    layers.push({
      data: { values: toRows(datasets) },
      mark: { type: "area", color: "#2E86AB", opacity: 0.09 },
      encoding: { x: xEnc, y: takeAxis(leftLabel, false) }
    });
  }

  // Partition by axis side
  const leftDatasets  = datasets.filter(d => !(d.axis === "right" && hasDual));
  const rightDatasets = datasets.filter(d =>   d.axis === "right" && hasDual);

  // barLayout only affects rendering when 2+ bar series share the same axis
  const leftBarDs  = leftDatasets.filter(d => d.mark === "bar");
  const rightBarDs = rightDatasets.filter(d => d.mark === "bar");

  // Helper: merge an array of datasets into a flat rows array
  function mergeRows(ds) {
    const rows = [];
    for (const d of ds)
      for (const { date, value } of d.data)
        rows.push({ date, value, series: d.title });
    return rows;
  }

  // ── Bar rendering ────────────────────────────────────────────────────────────
  // Grouped bars: each series gets its own layer with dates shifted slightly so
  // bars sit side-by-side.  xOffset only works with ordinal/band x scales, so
  // instead we shift date values by a fraction of the median inter-point gap.
  //
  // When hasDual=true the spec uses resolve:{scale:{y:"independent"}}, which
  // gives every layer its own y scale — including secondary left-bar layers.
  // To keep all left-bar layers on the same scale we compute the combined
  // min/max across all left-bar data and inject an explicit scale.domain into
  // every left-bar layer's y encoding.
  function _barForceDomain(barDs, isRight) {
    if (!hasDual || isRight || barDs.length <= 1) return null;
    const vals = barDs.flatMap(d => d.data.map(r => r.value))
                      .filter(v => v != null && isFinite(v));
    if (!vals.length) return null;
    const lo = Math.min(0, ...vals);
    const hi = Math.max(0, ...vals);
    return [lo === 0 ? 0 : lo * 1.05, hi * 1.05];
  }

  function pushBarLayers(barDs, axisLabel, isRight) {
    if (barDs.length === 0) return;
    const N = barDs.length;
    const isStacked = state.barLayout === "stacked" && N > 1;
    const forceDomain = _barForceDomain(barDs, isRight);

    function applyDomain(yE) {
      if (!forceDomain) return yE;
      return { ...yE, scale: { ...(yE.scale || {}), domain: forceDomain } };
    }

    if (isStacked || N === 1) {
      // Single merged layer (stacked or just one series)
      const rows  = mergeRows(barDs);
      const yBase = takeAxis(axisLabel, isRight);
      const yE    = isStacked ? { ...yBase, stack: "zero" } : { ...yBase, stack: false };
      layers.push({ data: { values: rows },
                    mark: { type: "bar", opacity: 0.8, clip: true },
                    encoding: { x: xEnc, y: applyDomain(yE), color: colorEncOnce() } });
    } else {
      // Grouped: one layer per series, dates shifted to place bars side-by-side.
      const ref = barDs[0].data;
      const gaps = [];
      for (let i = 1; i < ref.length; i++)
        gaps.push(new Date(ref[i].date) - new Date(ref[i-1].date));
      gaps.sort((a, b) => a - b);
      const medGap = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 30 * 86400000;

      const containerW = (document.getElementById("vis-container") || {}).offsetWidth || 600;
      const nPoints = Math.max(1, ref.length);
      const slotPx  = Math.max(4, (containerW - 90) / nPoints);
      const barPx   = Math.max(2, slotPx * 0.8 / N);
      const shiftMs = medGap * 0.8 / N;

      for (let i = 0; i < N; i++) {
        const d      = barDs[i];
        const offset = (i - (N - 1) / 2) * shiftMs;
        const rows   = d.data.map(({ date, value }) => ({
          date:   new Date(new Date(date).getTime() + offset).toISOString().slice(0, 10),
          value,
          series: d.title
        }));
        // Secondary layers: when hasDual, axis:null prevents ghost independent axes.
        // Without hasDual, omit axis key entirely so Vega-Lite shares the primary axis.
        const yBase = i === 0 ? takeAxis(axisLabel, isRight)
                     : hasDual ? { field: "value", type: "quantitative", axis: null }
                     :           { field: "value", type: "quantitative" };
        layers.push({ data: { values: rows },
                      mark: { type: "bar", opacity: 0.8, width: barPx, clip: true },
                      encoding: { x: xEnc, y: applyDomain({ ...yBase, stack: false }),
                                  color: colorEncOnce() } });
      }
    }
  }

  pushBarLayers(leftBarDs,  leftLabel,  false);

  // ── Left-axis lines ─────────────────────────────────────────────────────────
  const leftLineDs = leftDatasets.filter(d => d.mark !== "bar");
  if (leftLineDs.length > 0) {
    const rows = mergeRows(leftLineDs);
    layers.push({
      data: { values: rows },
      mark: { type: "line", strokeWidth: isMulti ? 2 : 2.5, interpolate: "linear" },
      encoding: { x: xEnc, y: takeAxis(leftLabel, false), color: colorEncOnce() }
    });
  }

  // ── Right-axis datasets ─────────────────────────────────────────────────────
  pushBarLayers(rightBarDs, rightLabel, true);

  const rightLineDs = rightDatasets.filter(d => d.mark !== "bar");
  for (const d of rightLineDs) {
    const rows = d.data.map(({ date, value }) => ({ date, value, series: d.title }));
    layers.push({
      data: { values: rows },
      mark: { type: "line", strokeWidth: 2, strokeDash: [5, 3], interpolate: "linear" },
      encoding: { x: xEnc, y: takeAxis(rightLabel, true), color: colorEncOnce() }
    });
  }

  // ── Hover interaction ────────────────────────────────────────────────────────
  // Tooltip source: invisible allRows dots with nearest:true Voronoi.
  // Voronoi intercepts pointer events for ALL marks, so bar tooltip encoding
  // on bar marks would never fire — instead the tooltip lives here.
  // Per-axis line dots below are purely visual (conditional opacity, no tooltip).

  // Invisible allRows dots — owns hover param (nearest:true Voronoi).
  // No tooltip encoding here; custom JS signal listener handles multi-series tooltip.
  // axis: null only when hasDual (independent scales); in shared-scale mode axis: null
  // suppresses the y-axis globally, so omit the axis key entirely.
  layers.push({
    data: { values: allRows },
    params: [{ name: "hover",
               select: { type: "point", on: "mouseover", nearest: true, fields: ["date"] } }],
    mark: { type: "point", opacity: 0 },
    encoding: {
      x: xEnc,
      y: hasDual ? { field: "value", type: "quantitative", axis: null }
                 : { field: "value", type: "quantitative" }
    }
  });

  // Crosshair rule — references hover param, no params of its own
  layers.push({
    data: { values: allRows },
    mark: { type: "rule", color: "#999", strokeWidth: 1, strokeDash: [3, 3] },
    encoding: {
      x: xEnc,
      opacity: { condition: { param: "hover", empty: false, value: 0.75 }, value: 0 }
    }
  });

  // Hover dots for left-axis line series (shares left y scale naturally)
  for (const d of leftLineDs) {
    const rows = d.data.map(({ date, value }) => ({ date, value, series: d.title }));
    layers.push({
      data: { values: rows },
      mark: { type: "point", filled: true, size: 70, strokeWidth: 1.5 },
      encoding: {
        x: xEnc,
        y: { field: "value", type: "quantitative" },
        color: colorEnc(false),
        stroke: colorEnc(false),
        opacity: { condition: { param: "hover", empty: false, value: 1 }, value: 0 },
        tooltip: [
          { field: "date",   type: "temporal",     format: "%b %Y", title: "Date"   },
          { field: "value",  type: "quantitative", format: ".2f",   title: "Value"  },
          { field: "series", type: "nominal",                       title: "Series" }
        ]
      }
    });
  }

  // Hover dots for right-axis line series (axis:null keeps independent scale
  // matching the right-axis data range without rendering a duplicate axis)
  for (const d of rightLineDs) {
    const rows = d.data.map(({ date, value }) => ({ date, value, series: d.title }));
    layers.push({
      data: { values: rows },
      mark: { type: "point", filled: true, size: 70, strokeWidth: 1.5 },
      encoding: {
        x: xEnc,
        y: { field: "value", type: "quantitative", axis: null },
        color: colorEnc(false),
        stroke: colorEnc(false),
        opacity: { condition: { param: "hover", empty: false, value: 1 }, value: 0 },
        tooltip: [
          { field: "date",   type: "temporal",     format: "%b %Y", title: "Date"   },
          { field: "value",  type: "quantitative", format: ".2f",   title: "Value"  },
          { field: "series", type: "nominal",                       title: "Series" }
        ]
      }
    });
  }

  // Fed 2% target for single-series primary-only YoY inflation
  if (state.transform === "pc1" && datasets.length === 1) {
    layers.push({
      data: { values: [{ y: 2 }] },
      mark: { type: "rule", color: "#C73E1D", strokeDash: [6, 3], strokeWidth: 1.5, opacity: 0.65 },
      encoding: { y: { field: "y", type: "quantitative" } }
    });
  }

  const spec = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    width: "container",
    height: 320,
    autosize: { type: "fit-x", contains: "padding" },
    padding: { left: leftFormat === "~s" ? 20 : 10, right: hasDual ? 65 : 20, top: 8, bottom: 10 },
    config: {
      axis:   { labelFont: "Georgia, serif", titleFont: "Georgia, serif" },
      legend: { labelFont: "Georgia, serif", titleFont: "Georgia, serif" }
    },
    layer: layers
  };

  if (hasDual) spec.resolve = { scale: { y: "independent" } };
  return spec;
}

// ─────────────────────────────────────────────────────────────────────────────
// Chart render
// ─────────────────────────────────────────────────────────────────────────────
let _currentView = null;

function updateChartMeta() {
  const titleEl  = document.getElementById("chart-title");
  const sourceEl = document.getElementById("chart-source");
  if (!titleEl || !sourceEl) return;

  const sids = [...state.selected];
  if (sids.length === 0) { titleEl.textContent = ""; sourceEl.textContent = ""; return; }

  // ── Title ──────────────────────────────────────────────────────────────────
  let title;
  if (sids.length === 1) {
    const info = DASHBOARD_DATA.nyfed[sids[0]] || DASHBOARD_DATA.series[sids[0]];
    title = info ? (info.label || info.title || sids[0]) : sids[0];
  } else if (sids.length <= 3) {
    title = sids.map(sid => {
      const info = DASHBOARD_DATA.nyfed[sid] || DASHBOARD_DATA.series[sid];
      return info ? (info.short_label || info.title || sid) : sid;
    }).join("  ·  ");
  } else {
    title = (state.category || "Selected Series") + " — Selected Series";
  }
  if (state.transform && state.transform !== "lin") {
    const tLabel = TRANSFORM_LABELS[state.transform] || state.transform;
    title += "  —  " + tLabel;
  }
  titleEl.textContent = title;

  // ── Source footnote ────────────────────────────────────────────────────────
  const sources = [];
  const seen = new Set();
  for (const sid of sids) {
    const info = DASHBOARD_DATA.nyfed[sid] || DASHBOARD_DATA.series[sid];
    const src = info && info.source ? info.source : "Federal Reserve Bank of St. Louis (FRED)";
    if (!seen.has(src)) { seen.add(src); sources.push(src); }
  }
  sourceEl.textContent = sources.length ? "Source: " + sources.join(", ") : "";
}

function updateChart() {
  const noMsg = document.getElementById("no-series-msg");

  updateChartMeta();

  if (state.selected.size === 0) {
    noMsg.style.display = "block";
    document.getElementById("vis").innerHTML = "";
    if (_currentView) { _currentView.finalize(); _currentView = null; }
    return;
  }
  noMsg.style.display = "none";

  const layerDefs = buildLayerArray();
  let datasets = layerDefs.map(l => {
    let rows = getRowsForLayer(l);
    rows = filterByRange(rows);
    return { ...l, data: rows };
  });

  datasets = applyNormalize(datasets);

  const spec = buildSpec(datasets);
  // Build lookup: date string → [{ title, value }, ...] for all active datasets
  const _dsLookup = {};
  for (const d of datasets) {
    for (const { date, value } of d.data) {
      if (!_dsLookup[date]) _dsLookup[date] = [];
      _dsLookup[date].push({ title: d.title, value });
    }
  }

  vegaEmbed("#vis", spec, { actions: false, renderer: "svg" })
    .then(result => {
      _currentView = result.view;

      // ── Custom multi-series tooltip ──────────────────────────────────────
      // Voronoi (nearest:true) picks ONE point per hover; we want ALL series
      // at the same date. Use the hover_tuple signal to get the selected date,
      // then look up all series values for it in _dsLookup.
      let _tip = document.getElementById("_fredTip");
      if (!_tip) {
        _tip = document.createElement("div");
        _tip.id = "_fredTip";
        _tip.style.cssText = [
          "position:fixed", "pointer-events:none", "z-index:9999",
          "background:#fff", "border:1px solid #ddd", "border-radius:5px",
          "padding:8px 12px", "font-size:12px", "font-family:sans-serif",
          "box-shadow:0 2px 8px rgba(0,0,0,0.13)", "display:none",
          "max-width:280px", "line-height:1.6"
        ].join(";");
        document.body.appendChild(_tip);
      }

      let _mx = 0, _my = 0;
      const _visEl = document.getElementById("vis");
      _visEl.addEventListener("mousemove", e => { _mx = e.clientX; _my = e.clientY; });
      _visEl.addEventListener("mouseleave", () => { _tip.style.display = "none"; });

      result.view.addSignalListener("hover_tuple", (name, val) => {
        if (!val || !val.values || !val.values.length) {
          _tip.style.display = "none";
          return;
        }
        // val.values[0] is the date as ms timestamp (Vega temporal internal)
        const dateStr = new Date(val.values[0]).toISOString().slice(0, 10);
        const entries = _dsLookup[dateStr];
        if (!entries || !entries.length) { _tip.style.display = "none"; return; }

        const label = new Date(dateStr + "T12:00:00Z").toLocaleDateString("en-US",
          { year: "numeric", month: "short" });
        let html = `<div style="font-weight:600;margin-bottom:4px;color:#333;border-bottom:1px solid #eee;padding-bottom:4px">${label}</div>`;
        for (const e of entries) {
          const v = (e.value != null && isFinite(e.value)) ? (+e.value).toFixed(2) : "—";
          html += `<div style="display:flex;justify-content:space-between;gap:16px">` +
                  `<span style="color:#555">${e.title}</span>` +
                  `<span style="font-weight:600;color:#222">${v}</span></div>`;
        }
        _tip.innerHTML = html;
        _tip.style.display = "block";

        const vw = window.innerWidth, vh = window.innerHeight;
        const tw = _tip.offsetWidth, th = _tip.offsetHeight;
        let tx = _mx + 14, ty = _my - 10;
        if (tx + tw > vw - 8) tx = _mx - tw - 14;
        if (ty + th > vh - 8) ty = _my - th - 10;
        _tip.style.left = tx + "px";
        _tip.style.top  = ty + "px";
      });

      // Notify parent frame of height (for iframeResizer in Squarespace)
      try {
        const h = document.getElementById("app").scrollHeight;
        window.parent.postMessage({ type: "fredDashboardHeight", height: h }, "*");
      } catch (e) {}
    })
    .catch(console.error);

  if (state.tableVisible) renderTable();
}

// ─────────────────────────────────────────────────────────────────────────────
// Data table
// ─────────────────────────────────────────────────────────────────────────────
function renderTable() {
  const table = document.getElementById("data-table");
  const layerDefs = buildLayerArray();
  const datasets = layerDefs.map(l => {
    let rows = getRowsForLayer(l);
    rows = filterByRange(rows);
    return { title: l.title, rows };
  });

  if (datasets.length === 0) { table.innerHTML = ""; return; }

  const allDates = new Set();
  for (const ds of datasets) ds.rows.forEach(r => allDates.add(r.date));
  const sortedDates = [...allDates].sort().reverse();

  const lookup = {};
  for (const ds of datasets) {
    lookup[ds.title] = {};
    for (const { date, value } of ds.rows) lookup[ds.title][date] = value;
  }

  const headers = ["Date", ...datasets.map(ds => ds.title)];
  let html = "<thead><tr>" + headers.map(h => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>";

  for (const d of sortedDates.slice(0, 150)) {
    const cells = ["<td>" + d + "</td>"];
    for (const ds of datasets) {
      const v = lookup[ds.title][d];
      cells.push("<td>" + (v !== undefined ? v.toFixed(2) : "—") + "</td>");
    }
    html += "<tr>" + cells.join("") + "</tr>";
  }
  html += "</tbody>";
  table.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// Chip strip — shows all selected series as dismissible pills with per-series
// mark type buttons, L/R axis assignment, and optional secondary layer chips
// ─────────────────────────────────────────────────────────────────────────────
function renderChips() {
  const strip = document.getElementById("chip-strip");
  const container = document.getElementById("chips");

  if (state.selected.size === 0) {
    strip.style.display = "none";
    container.innerHTML = "";
    return;
  }

  strip.style.display = "flex";
  container.innerHTML = "";

  for (const sid of state.selected) {
    const info = DASHBOARD_DATA.nyfed[sid] || DASHBOARD_DATA.series[sid];
    const title  = info ? (info.short_label || info.title || sid) : sid;
    const axis   = state.axisAssignment.get(sid) || "left";
    const mark   = state.markAssignment.get(sid)  || "line";
    const isFRED = !!DASHBOARD_DATA.series[sid];
    const hasSec = state.secondaryLayers.has(sid);
    const multiSel = state.selected.size > 1;

    // ── Primary chip ──────────────────────────────────────────────────────────
    const chip = document.createElement("span");
    chip.className = "chip";

    const txt = document.createElement("span");
    txt.textContent = title;
    chip.appendChild(txt);

    // Per-series mark type buttons (FRED series only)
    if (isFRED) {
      const markGroup = document.createElement("span");
      markGroup.className = "chip-mark";
      for (const m of ["line", "bar"]) {
        const mb = document.createElement("button");
        mb.className = "chip-mark-btn" + (mark === m ? " active" : "");
        mb.textContent = m === "line" ? "≡" : "▋";
        mb.title = m === "line" ? "Line" : "Bar";
        mb.addEventListener("click", () => {
          state.markAssignment.set(sid, m);
          renderChips();
          updateChart();
        });
        markGroup.appendChild(mb);
      }
      chip.appendChild(markGroup);
    }

    // L / R axis (multiple FRED series, or single with a secondary layer)
    if (isFRED && (multiSel || hasSec)) {
      const axisGroup = document.createElement("span");
      axisGroup.className = "chip-axis";
      for (const side of ["left", "right"]) {
        const ab = document.createElement("button");
        ab.className = "chip-axis-btn" + (axis === side ? " active" : "");
        ab.textContent = side === "left" ? "L" : "R";
        ab.title = side === "left" ? "Left Y-axis" : "Right Y-axis";
        ab.addEventListener("click", () => {
          state.axisAssignment.set(sid, side);
          renderChips();
          updateChart();
        });
        axisGroup.appendChild(ab);
      }
      chip.appendChild(axisGroup);
    }

    // "+" add secondary layer (FRED series with multiple transforms, not already present)
    if (isFRED && !hasSec) {
      const s = DASHBOARD_DATA.series[sid];
      const allT = s ? Object.keys(s.transforms) : [];
      if (allT.length > 1) {
        const plusBtn = document.createElement("button");
        plusBtn.className = "chip-plus-btn";
        plusBtn.textContent = "+";
        plusBtn.title = "Add second transform layer";
        plusBtn.addEventListener("click", () => {
          const altT = TRANSFORM_ORDER.filter(t => allT.includes(t) && t !== state.transform);
          const defaultT = altT.length > 0 ? altT[0] : (allT.find(t => t !== state.transform) || allT[0]);
          state.secondaryLayers.set(sid, { transform: defaultT, mark: "bar", axis: "right" });
          renderChips();
          updateChart();
        });
        chip.appendChild(plusBtn);
      }
    }

    // Remove
    const removeBtn = document.createElement("button");
    removeBtn.className = "chip-remove";
    removeBtn.textContent = "×";
    removeBtn.title = "Remove";
    removeBtn.addEventListener("click", () => {
      state.selected.delete(sid);
      state.axisAssignment.delete(sid);
      state.markAssignment.delete(sid);
      state.secondaryLayers.delete(sid);
      const cb = document.querySelector('.series-cb[data-id="' + sid + '"]');
      if (cb) cb.checked = false;
      updateTransformOptions();
      renderChips();
      updateChart();
    });
    chip.appendChild(removeBtn);
    container.appendChild(chip);

    // ── Secondary layer chip ───────────────────────────────────────────────────
    if (hasSec) {
      const sec = state.secondaryLayers.get(sid);
      const s = DASHBOARD_DATA.series[sid];
      const allT = s ? Object.keys(s.transforms) : [];

      const secChip = document.createElement("span");
      secChip.className = "secondary-chip";

      const connector = document.createElement("span");
      connector.textContent = "└";
      connector.style.cssText = "color:#aaa;font-size:10px;margin-right:2px;";
      secChip.appendChild(connector);

      // Transform select (all available transforms for this series)
      const tSel = document.createElement("select");
      tSel.className = "secondary-chip-select";
      for (const t of TRANSFORM_ORDER.filter(x => allT.includes(x))) {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = TRANSFORM_LABELS[t] || t;
        if (t === sec.transform) opt.selected = true;
        tSel.appendChild(opt);
      }
      tSel.addEventListener("change", () => {
        sec.transform = tSel.value;
        updateChart();
      });
      secChip.appendChild(tSel);

      // Mark type
      const secMarkGroup = document.createElement("span");
      secMarkGroup.className = "chip-mark";
      for (const m of ["line", "bar"]) {
        const mb = document.createElement("button");
        mb.className = "chip-mark-btn" + (sec.mark === m ? " active" : "");
        mb.textContent = m === "line" ? "≡" : "▋";
        mb.title = m === "line" ? "Line" : "Bar";
        mb.addEventListener("click", () => {
          sec.mark = m;
          renderChips();
          updateChart();
        });
        secMarkGroup.appendChild(mb);
      }
      secChip.appendChild(secMarkGroup);

      // L / R axis
      const secAxisGroup = document.createElement("span");
      secAxisGroup.className = "chip-axis";
      for (const side of ["left", "right"]) {
        const ab = document.createElement("button");
        ab.className = "chip-axis-btn" + (sec.axis === side ? " active" : "");
        ab.textContent = side === "left" ? "L" : "R";
        ab.title = side === "left" ? "Left Y-axis" : "Right Y-axis";
        ab.addEventListener("click", () => {
          sec.axis = side;
          renderChips();
          updateChart();
        });
        secAxisGroup.appendChild(ab);
      }
      secChip.appendChild(secAxisGroup);

      // Remove secondary layer
      const secRemove = document.createElement("button");
      secRemove.className = "chip-remove";
      secRemove.textContent = "×";
      secRemove.title = "Remove secondary layer";
      secRemove.addEventListener("click", () => {
        state.secondaryLayers.delete(sid);
        renderChips();
        updateChart();
      });
      secChip.appendChild(secRemove);

      container.appendChild(secChip);
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", init);
</script>
