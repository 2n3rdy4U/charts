<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ── PWA / app launcher ──────────────────────────────── -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e1a30" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CCM" />

  <!-- ── Primary SEO ─────────────────────────────────────── -->
  <title>Consumer Credit Matters — Data Platform</title>
  <meta name="description" content="Data-driven analysis of consumer credit markets. Explore loan-level ABS performance, new issuance activity, credit card trends, and key macroeconomic indicators." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.consumercreditmatters.com/" />

  <!-- ── Favicons / app icons ────────────────────────────── -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <!-- ── Open Graph (LinkedIn, social sharing) ───────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.consumercreditmatters.com/" />
  <meta property="og:title" content="Consumer Credit Matters — Data Platform" />
  <meta property="og:description" content="Data-driven analysis of consumer credit markets. Explore loan-level ABS performance, new issuance activity, credit card trends, and key macroeconomic indicators." />
  <meta property="og:site_name" content="Consumer Credit Matters" />
  <meta property="og:image" content="https://www.consumercreditmatters.com/assets/brand/social-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Consumer Credit Matters" />

  <!-- ── Twitter / X card ────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Consumer Credit Matters — Data Platform" />
  <meta name="twitter:description" content="Data-driven analysis of consumer credit markets. Explore loan-level ABS performance, new issuance activity, credit card trends, and key macroeconomic indicators." />
  <meta name="twitter:image" content="https://www.consumercreditmatters.com/assets/brand/social-card.png" />
  <meta name="twitter:image:alt" content="Consumer Credit Matters" />

  <!-- ── Structured data (Google rich results) ───────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Consumer Credit Matters Data Platform",
    "url": "https://www.consumercreditmatters.com/",
    "description": "Data-driven analysis of consumer credit markets. Loan-level ABS performance, new issuance activity, credit card trends, and macroeconomic indicators.",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Web",
    "publisher": {
      "@type": "Organization",
      "name": "Consumer Credit Matters",
      "url": "https://www.consumercreditmatters.com/"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ── Header ─────────────────────────────────────────── -->
    <header id="header">
      <button id="hamburger" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a href="./" class="brand" aria-label="Consumer Credit Matters home">
        <img src="assets/brand/logo-horizontal-white.png" alt="Consumer Credit Matters" class="brand-logo" />
      </a>
      <nav class="header-right">
        <a href="https://www.consumercreditmatters.com/subscribe" target="_top" rel="noopener" class="btn-primary">Subscribe</a>
      </nav>
    </header>

    <!-- ── Nav backdrop (mobile drawer overlay) ──────────── -->
    <div id="nav-backdrop" aria-hidden="true"></div>

    <!-- ── Left rail (built by app.js) ───────────────────── -->
    <nav id="rail" aria-label="Data modules"></nav>

    <!-- ── Main content ──────────────────────────────────── -->
    <main id="main">

      <!-- Breadcrumb bar -->
      <div id="panel-bar">
        <span id="panel-section-label" style="color:var(--color-muted)"></span>
        <span class="panel-sep" id="panel-sep" style="display:none">›</span>
        <span id="panel-title"></span>
      </div>

      <!-- Loading spinner (shown while iframe loads) -->
      <div id="panel-loading">
        <div class="spinner"></div>
      </div>

      <!-- Content area: iframe or welcome state -->
      <div id="panel-content">
        <div id="welcome">
          <div class="welcome-header">
            <div class="welcome-brand" aria-label="Consumer Credit Matters">
              <img src="assets/brand/logo-mark-primary.png" alt="" class="welcome-mark" aria-hidden="true" />
              <div class="welcome-wordmark">
                <span>Consumer</span>
                <span>Credit</span>
                <span>Matters</span>
              </div>
            </div>
            <h1 class="welcome-title">Independent data on U.S. consumer credit markets</h1>
          </div>
          <div class="tile-grid" id="tile-grid">
            <!-- Populated by app.js -->
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // Show separator in breadcrumb only when a panel is active
    const sep   = document.getElementById('panel-sep');
    const title = document.getElementById('panel-title');
    const obs   = new MutationObserver(() => {
      sep.style.display = title.textContent ? 'inline' : 'none';
    });
    obs.observe(title, { childList: true, characterData: true, subtree: true });

    // ── "Add to Home Screen" banner (iOS Safari only) ──────────────
    // iOS Safari never auto-prompts the user to install. Show a small,
    // dismissable banner after 30s of engagement, once per browser,
    // explaining the Share → Add to Home Screen flow. Skip if already
    // running as an installed PWA (navigator.standalone) or if the user
    // has previously dismissed.
    (function installBanner() {
      var ua  = navigator.userAgent;
      var iOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
      var alreadyInstalled = ('standalone' in window.navigator) && window.navigator.standalone === true;
      var dismissed = false;
      try { dismissed = localStorage.getItem('ccm_install_banner_dismissed') === '1'; } catch (_) {}
      if (!iOS || !isSafari || alreadyInstalled || dismissed) return;

      setTimeout(function () {
        var bar = document.createElement('div');
        bar.id = 'cc-install-banner';
        bar.style.cssText = [
          'position:fixed', 'left:12px', 'right:12px',
          'bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px))',
          'z-index:9999', 'background:#0e1a30', 'color:#e8edf8',
          'border:1px solid #1e3260', 'border-radius:10px',
          'padding:12px 14px', 'display:flex', 'align-items:center', 'gap:10px',
          'font-family:Inter,system-ui,sans-serif', 'font-size:13px',
          'box-shadow:0 6px 24px rgba(0,0,0,0.30)'
        ].join(';');
        bar.innerHTML =
          '<div style="flex:1;line-height:1.4;">' +
            'Add <strong>Consumer Credit Matters</strong> to your home screen — ' +
            'tap <span style="display:inline-block;border:1px solid #7eb3ff;border-radius:4px;padding:0 5px;font-size:11px;color:#7eb3ff;">Share</span>, ' +
            'then <em>Add to Home Screen</em>.' +
          '</div>' +
          '<button type="button" aria-label="Dismiss" ' +
            'style="background:transparent;border:none;color:#7b92bc;font-size:18px;line-height:1;cursor:pointer;padding:4px 6px;">' +
            '×' +
          '</button>';
        bar.querySelector('button').addEventListener('click', function () {
          try { localStorage.setItem('ccm_install_banner_dismissed', '1'); } catch (_) {}
          bar.remove();
        });
        document.body.appendChild(bar);
      }, 30000); // 30s engagement
    })();
  </script>
</body>
</html>
