<script>
(function () {
  var TRUSTS = ["AMXCA", "BACCT", "CCCIT", "CHAIT", "COMET", "DRYROCK", "FNBO", "SYNIT", "WFCARD", "WFNN"];
  var q = new URLSearchParams(location.search);
  var codes = (q.get("trusts") || "").split(",").map(function (c) { return c.trim().toUpperCase(); })
                .filter(function (c) { return TRUSTS.indexOf(c) >= 0; });
  var first = (q.get("metrics") || "").split(",")[0].trim();
  var m = ({pr: "payment_rate", xs: "excess_spread", dr: "charge_off_rate", dq: "dq_30plus", bal: "trust_balance"})[first];
  var p = {};
  if (m) p.m = m;
  var target;
  if (codes.length === 1) target = "/abs/credit-card/" + codes[0] + "/";
  else { if (codes.length) p.sel = codes.join(","); target = "/abs/credit-card/index.html"; }
  var qs = Object.keys(p).map(function (k) { return k + "=" + encodeURIComponent(p[k]).replace(/%2C/g, ","); }).join("&");
  location.replace(target + (qs ? "?" + qs : ""));
})();
</script>
